<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人生服务器">
<meta name="theme-color" content="#eaf4ff">
<title>我的人生服务器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a sky-blue playroom — the sprout buddy greets you up top, a puffy capture card, three pastel boards behind bubbly tabs */
:root{
  --bg:#eaf4ff; --bg-2:#f6faff; --surface:#ffffff; --surface-2:#edf4fe; --line:#d3e3f7;
  --fg:#1f3156; --muted:#5b7099; --faint:#9db0cf;
  --work:#3a8bff; --work-soft:#e0eeff; --work-ink:#1f66d1; --brand:#2f7cf6; --brand-ink:#1b5fc4; --title:#1b5fc4;
  --life:#2fb38a; --life-soft:#dcf6ec; --life-ink:#1f8a69;
  --study:#8b6cf0; --study-soft:#efeaff; --study-ink:#6447d1;
  --habit:#ff9a3d; --habit-soft:#ffeedd; --habit-ink:#d86f12;
  --pink:#ff8fb1; --buddy:#ffe08a; --buddy-ink:#3a3350; --leaf:#5cc98f; --leaf-2:#3faa74; --bark:#e3a86f; --soil:#c9b49a; --water:#4aa8ff;
  --danger:#ef5d6e; --shadow:0 6px 0 rgba(47,124,246,.12);
  --f-display:"ZCOOL KuaiLe","Fredoka","Noto Sans SC",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]):not([data-tod]){
  --bg:#0f1a2e; --bg-2:#14223b; --surface:#1a2a47; --surface-2:#223558; --line:#2c4269;
  --fg:#eaf2ff; --muted:#a3b7d8; --faint:#6a82aa;
  --work:#6fb0ff; --work-soft:#1f3a63; --work-ink:#a6cdff; --brand:#3a8bff; --brand-ink:#1f66d1; --title:#a6cdff;
  --life:#58d6ac; --life-soft:#1f4a3e; --life-ink:#7fe6c3;
  --study:#b29cff; --study-soft:#352a63; --study-ink:#cfc2ff;
  --habit:#ffb366; --habit-soft:#4a3520; --habit-ink:#ffc68a;
  --pink:#ff9fbe; --buddy:#ffd76e; --buddy-ink:#2a2540; --leaf:#6fdc9f; --leaf-2:#45b67f; --bark:#c98f58; --soil:#4b4361; --water:#6cbcff;
  --danger:#ff8592; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"],:root:not([data-theme])[data-tod="night"]{
  --bg:#0f1a2e; --bg-2:#14223b; --surface:#1a2a47; --surface-2:#223558; --line:#2c4269;
  --fg:#eaf2ff; --muted:#a3b7d8; --faint:#6a82aa;
  --work:#6fb0ff; --work-soft:#1f3a63; --work-ink:#a6cdff; --brand:#3a8bff; --brand-ink:#1f66d1; --title:#a6cdff;
  --life:#58d6ac; --life-soft:#1f4a3e; --life-ink:#7fe6c3;
  --study:#b29cff; --study-soft:#352a63; --study-ink:#cfc2ff;
  --habit:#ffb366; --habit-soft:#4a3520; --habit-ink:#ffc68a;
  --pink:#ff9fbe; --buddy:#ffd76e; --buddy-ink:#2a2540; --leaf:#6fdc9f; --leaf-2:#45b67f; --bark:#c98f58; --soil:#4b4361; --water:#6cbcff;
  --danger:#ff8592; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.gear{border:none;background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:16px;box-shadow:0 3px 0 var(--line);padding:0}
.title-row .jbtn{margin-left:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 10% 6%,var(--bg-2) 0 130px,transparent 131px),radial-gradient(circle at 90% 18%,var(--bg-2) 0 90px,transparent 91px),radial-gradient(circle at 80% 70%,var(--bg-2) 0 110px,transparent 111px);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* garden with the growing buddy */
.garden{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:24px;padding:10px 16px 10px 8px;box-shadow:var(--shadow)}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;line-height:1.1;color:var(--title)}
.today{font-family:var(--f-num);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.buddy{width:104px;height:104px;flex:none;cursor:pointer;position:relative}
.buddy svg{width:100%;height:100%;overflow:visible}
.g-text{min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage b{font-family:var(--f-display);font-weight:400;font-size:18px}
.stage .lv{font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--leaf-2);background:color-mix(in srgb,var(--leaf) 20%,transparent);border-radius:999px;padding:1px 9px}
.bubble{position:relative;background:var(--bg-2);border-radius:14px;padding:6px 12px;font-size:13.5px;width:fit-content;max-width:100%}
.bubble::before{content:"";position:absolute;left:-6px;top:13px;width:12px;height:12px;background:var(--bg-2);transform:rotate(45deg);border-radius:3px}
.bubble span{position:relative}
.meter{display:flex;flex-direction:column;gap:5px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meter-top .w{font-family:var(--f-num);font-weight:600;color:var(--water);font-variant-numeric:tabular-nums}
.wbar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--water),var(--leaf));transition:width .6s}
.status{font-size:13px;color:var(--danger)}
.plus{position:absolute;font-family:var(--f-num);font-weight:600;color:var(--water);font-size:18px;pointer-events:none;z-index:3}
.drop{position:fixed;font-size:20px;pointer-events:none;z-index:31;left:0;top:0}
/* capture: floating button + bottom sheet */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:50%;width:72px;height:72px;padding:0;background:var(--brand);box-shadow:0 5px 0 var(--brand-ink),0 10px 24px rgba(30,80,160,.25);display:grid;place-items:center;transition:transform .15s}
.fab svg{width:60px;height:60px;overflow:visible;margin-top:2px}
.fab:hover{transform:translateY(-2px) rotate(-6deg)}
.fab .tw{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.fab .tw{animation:tw 1.8s ease-in-out infinite}.fab .tw2{animation-delay:.6s}.fab .tw3{animation-delay:1.1s}}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brand-ink)}
.cap-wrap{position:fixed;inset:0;z-index:25;background:rgba(20,35,70,.38);display:flex;align-items:flex-end;justify-content:center}
.cap-wrap .capture{width:100%;max-width:580px;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.cap-wrap{align-items:center}.cap-wrap .capture{border-radius:26px}}
.cap-head .x{margin-left:auto;border:none;background:var(--surface-2);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--muted);line-height:1}
@media (prefers-reduced-motion:no-preference){.cap-wrap:not([hidden]) .capture{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* capture */
.capture{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.cap-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:18px}
.cap-head .pen{width:26px;height:26px}
.capture textarea{width:100%;min-height:68px;resize:vertical;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);padding:11px 14px;line-height:1.55}
.capture textarea:focus{border-color:var(--brand);outline:none}
.cap-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 0 var(--brand-ink)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.hint{font-size:12.5px;color:var(--muted)}
.preview{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.pv{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--bg-2)}
.pv input[type=checkbox]{margin-top:5px;accent-color:var(--work);width:16px;height:16px}
.pv-body{min-width:0;display:flex;flex-direction:column;gap:7px}
.pv-title{border:none;background:transparent;padding:0;width:100%;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border:2px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--muted)}
.chip.on.work{background:var(--work-soft);color:var(--work-ink);border-color:var(--work)}
.chip.on.study{background:var(--study-soft);color:var(--study-ink);border-color:var(--study)}
.chip.on.life{background:var(--life-soft);color:var(--life-ink);border-color:var(--life)}
.chip.on.hz{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gap{width:4px}

/* tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:8px 6px;font-weight:500;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center;transition:transform .15s}
.tab svg{width:22px;height:22px;flex:none}
.tab .tl{white-space:nowrap}
.tab .n{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;padding:0 8px;border-radius:999px;background:var(--surface-2)}
.tab[aria-selected=true]{color:var(--fg);transform:translateY(-2px)}
.tab[data-k=work][aria-selected=true]{border-color:var(--work);background:var(--work-soft);box-shadow:0 4px 0 var(--work)}
.tab[data-k=study][aria-selected=true]{border-color:var(--study);background:var(--study-soft);box-shadow:0 4px 0 var(--study)}
.tab[data-k=life][aria-selected=true]{border-color:var(--life);background:var(--life-soft);box-shadow:0 4px 0 var(--life)}
.tab[data-k=habit][aria-selected=true]{border-color:var(--habit);background:var(--habit-soft);box-shadow:0 4px 0 var(--habit)}
.tab[aria-selected=true] .n{background:var(--surface)}

/* boards */
.board{display:flex;flex-direction:column;gap:20px;--c:var(--work);--soft:var(--work-soft);--ink:var(--work-ink)}
.board[data-k=study]{--c:var(--study);--soft:var(--study-soft);--ink:var(--study-ink)}
.board[data-k=life]{--c:var(--life);--soft:var(--life-soft);--ink:var(--life-ink)}
.board[data-k=habit]{--c:var(--habit);--soft:var(--habit-soft);--ink:var(--habit-ink)}
.group h2{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 8px;color:var(--fg)}
.group h2 .badge{width:10px;height:10px;border-radius:50%;background:var(--c)}
.group h2 .sub{font-family:var(--f-body);font-size:12.5px;color:var(--muted)}
.group h2 .add{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:var(--surface);color:var(--c);display:grid;place-items:center;padding:0;flex:none;transition:transform .15s,background .15s}
.group h2 .add:hover{background:var(--c);color:#fff;transform:rotate(90deg)}
.group h2 .add svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.group h2 .cnt{margin-left:auto;font-family:var(--f-num);font-size:14px;color:var(--ink);background:var(--soft);border-radius:999px;padding:0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:2px dashed var(--line);color:var(--muted);font-size:13.5px}
.empty svg{width:44px;height:44px;flex:none}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);transition:transform .15s}
.task:hover{transform:translateY(-1px)}
.check{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;transition:transform .15s}
.check:hover{transform:scale(1.1)}
.check.on{background:var(--c)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on svg{opacity:1}
.t-main{min-width:0;border:none;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.t-title{overflow-wrap:anywhere;font-weight:500}
.task.done{box-shadow:none;background:var(--surface-2)}
.task.done .t-title{color:var(--faint);text-decoration:line-through;font-weight:400}
.t-note{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.due.over{background:var(--danger);color:#fff}
.due.soon{background:var(--habit-soft);color:var(--habit-ink)}
details.done-box summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 2px;list-style:none}
details.done-box summary::before{content:"▸ ";}
details.done-box[open] summary::before{content:"▾ ";}
details.done-box .list{margin-top:8px}

/* life sub-sections */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.seg button{border:none;background:transparent;border-radius:14px;padding:8px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button .n{font-family:var(--f-num);font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 7px}
.seg button[aria-pressed=true]{background:var(--life-soft);color:var(--life-ink)}
.seg button[aria-pressed=true] .n{background:var(--surface)}
.card{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.card-head .sub{font-size:12.5px;color:var(--muted)}
.card-head .right{margin-left:auto;display:flex;gap:6px}
.link{border:none;background:none;color:var(--life-ink);font-size:13px;padding:2px 4px}
.staples{display:flex;flex-wrap:wrap;gap:7px}
.st{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;transition:transform .12s}
.st:hover{transform:translateY(-1px)}
.st.pick{background:var(--life);border-color:var(--life);color:#fff}
.st.inlist{border-style:dashed;color:var(--faint)}
.st .x{font-size:13px;color:var(--danger);font-weight:700}
.shop-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shop-add input[type=text]{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;background:var(--bg-2);padding:8px 16px}
.shop-add input[type=text]:focus{border-color:var(--life);outline:none}
.shop-add label{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
.shop-add input[type=checkbox]{accent-color:var(--life)}
.btn.life{background:var(--life);border-color:var(--life);color:#fff;box-shadow:0 3px 0 var(--life-ink)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:2px dotted var(--line)}
.item:first-child{border-top:none}
.item .nm{overflow-wrap:anywhere;min-width:0}
.item.got .nm{color:var(--faint);text-decoration:line-through}
.item .star{border:none;background:none;padding:2px;font-size:16px;color:var(--faint);line-height:1}
.item .star.on{color:var(--habit)}
.item .del{border:none;background:none;color:var(--faint);font-size:18px;padding:0 4px;line-height:1}
.item .del:hover{color:var(--danger)}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* daily summary */
.mood{gap:5px!important;padding:3px 11px 3px 6px!important}
.mood .mface{width:28px;height:28px;flex:none;margin-block:-3px}
.cal-mood .mface{width:17px;height:17px;display:block}
.cal{background:var(--surface);border-radius:22px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.cal-head button{border:none;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:17px;color:var(--muted)}
.cal-head button:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:2px}
.cal-day{min-height:60px;border:2px solid transparent;background:var(--bg-2);border-radius:12px;padding:3px 3px 4px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;transition:transform .12s}
.cal-day:hover:not(:disabled){transform:translateY(-1px)}
.cal-day:disabled{opacity:.35;cursor:default}
.cal-day.sel{border-color:var(--brand);background:var(--surface-2)}
.cal-top{display:flex;justify-content:space-between;align-items:center;gap:2px;min-height:16px}
.cal-top b{font-family:var(--f-num);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;padding-left:2px}
.cal-day.today .cal-top b{color:#fff;background:var(--brand);border-radius:999px;padding:0 5px}
.cal-note{font-size:11px;color:var(--brand)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pill{font-style:normal;font-family:var(--f-num);font-weight:600;font-size:10px;line-height:15px;text-align:center;border-radius:6px;background:var(--s);color:var(--c);font-variant-numeric:tabular-nums}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:9px;height:9px;border-radius:3px}
.jnav{scroll-margin-top:72px}
.title-row .jbtn{margin-left:auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:500;font-size:14px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.title-row .jbtn:hover{transform:translateY(-1px)}
.title-row .jbtn[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 0 var(--brand-ink)}
.jnav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:20px;padding:8px 10px;box-shadow:var(--shadow)}
.jnav h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;text-align:center}
.jnav h2 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.jnav button{border:none;background:var(--surface-2);border-radius:999px;width:38px;height:38px;font-size:18px;color:var(--muted)}
.jnav button:disabled{opacity:.35;cursor:default}
.jstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.jstat{background:var(--surface);border-radius:18px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.jstat b{display:block;font-family:var(--f-num);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.jstat span{font-size:12px;color:var(--muted)}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jbox{background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.jbox h4{margin:0;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:400;font-size:17px}
.jbox h4 i{width:10px;height:10px;border-radius:50%;flex:none}
.jbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.jbox li{display:flex;gap:6px;align-items:baseline;overflow-wrap:anywhere}
.jbox li::before{content:"✓";font-weight:700;color:var(--c,var(--muted))}
.jbox .none{font-size:13px;color:var(--faint)}
.comment{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.comment .mini{width:64px;height:64px}
.comment .mini svg{width:100%;height:100%;overflow:visible}
.comment .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.comment h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.comment p{margin:0;line-height:1.75;white-space:pre-wrap}
.comment .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reflect{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.reflect h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px;display:flex;gap:4px;align-items:center}
.mood.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.reflect textarea{width:100%;min-height:96px;resize:vertical;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);padding:10px 14px;line-height:1.6}
.reflect textarea:focus{border-color:var(--brand);outline:none}
.saved{font-size:12px;color:var(--muted)}
@media(max-width:520px){.jgrid{grid-template-columns:1fr}.jstats{grid-template-columns:repeat(2,1fr)}}

/* forest */
.forest-btn{margin-left:auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:500;display:flex;gap:4px;align-items:center;white-space:nowrap}
.forest-btn .fn{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.forest-btn[aria-pressed=true]{border-color:var(--leaf-2);background:color-mix(in srgb,var(--leaf) 18%,transparent)}
#plantBtn{width:fit-content;padding:5px 14px}
.forest-card{background:var(--surface);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.meadow-wrap{border-radius:18px;overflow:hidden;margin-inline:-4px;box-shadow:inset 0 0 0 2px var(--line)}
.meadow{display:block;width:100%;height:auto}
.fs-s1{stop-color:color-mix(in srgb,var(--water) 38%,var(--surface))}
.fs-s2{stop-color:color-mix(in srgb,var(--water) 10%,var(--surface))}
.fs-sun{fill:var(--buddy)}
.fs-sun.halo{opacity:.25}
.fs-cloud ellipse{fill:var(--surface);opacity:.92}
.fs-hill{fill:color-mix(in srgb,var(--leaf) 38%,var(--surface))}
.fs-grass{fill:color-mix(in srgb,var(--leaf) 58%,var(--surface))}
.fs-grass2{fill:color-mix(in srgb,var(--leaf) 72%,var(--surface))}
.fs-tuft{fill:var(--leaf-2);opacity:.75}
.fs-f1{fill:var(--pink)}.fs-f2{fill:#fff}.fs-f3{fill:var(--study)}.fs-fc{fill:var(--buddy)}
.fs-glow{fill:#fff;opacity:.7}
.fs-tree{cursor:pointer}
.fs-tree:focus{outline:none}
.fs-tree:focus-visible svg{outline:2px solid var(--brand)}
.forest-cap{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;min-height:2.6em}
.forest-cap b{color:var(--fg);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .fs-cloud{animation:drift 18s ease-in-out infinite alternate}.fs-cloud.c2{animation-duration:24s}
  .fs-tree.sel svg{animation:hop .55s ease-out}
}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(14px)}}

.ftree{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-width:0}
.ftree svg{width:100%;max-width:124px;aspect-ratio:1;height:auto}
.ftree b{font-family:var(--f-display);font-weight:400;font-size:15px}
.ftree small{font-size:11.5px;color:var(--muted)}
.ftree.growing b{color:var(--leaf-2)}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 4px;font-size:13.5px;display:flex;gap:7px;align-items:center}
.sw .dot{width:22px;height:22px;border-radius:50%;background:var(--buddy);box-shadow:inset 0 -6px 0 var(--leaf),0 0 0 2px var(--flower),0 0 0 3px var(--line)}
.sw.on{border-color:var(--brand);background:var(--surface-2)}

/* habits */
.daycard{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.daycard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.daycard .big{font-family:var(--f-num);font-weight:600;font-size:28px;color:var(--habit-ink);font-variant-numeric:tabular-nums;line-height:1}
.bar{grid-column:1/-1;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(45deg,var(--habit) 0 10px,var(--pink) 10px 20px);transition:width .4s}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.stamp{width:52px;height:52px;border-radius:50%;border:3px dashed var(--faint);background:transparent;display:grid;place-items:center;padding:0;transition:transform .2s}
.stamp:hover{transform:rotate(-8deg) scale(1.05)}
.stamp.on{border:3px solid var(--habit);background:var(--habit-soft)}
.stamp svg{width:32px;height:32px;opacity:.25;transition:opacity .2s,transform .3s}
.stamp.on svg{opacity:1;transform:rotate(-12deg)}
.h-main{min-width:0;display:flex;flex-direction:column;gap:7px}
.h-name{font-weight:500;overflow-wrap:anywhere}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;background:var(--surface-2)}
.dot.on{background:var(--habit)}
.dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--habit)}
.streak{display:flex;flex-direction:column;align-items:center;min-width:48px}
.streak b{font-family:var(--f-num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1;color:var(--habit-ink)}
.streak small{font-size:11px;color:var(--muted);margin-top:2px}
.streak svg{width:18px;height:18px}
.h-del{border:none;background:none;color:var(--faint);font-size:12px;padding:0;text-align:left;width:fit-content}
.h-del:hover{color:var(--danger)}
.habit-add{display:flex;gap:8px}
.habit-add input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:8px 16px}
.habit-add input:focus{border-color:var(--habit);outline:none}
.habit-add .btn{background:var(--habit);border-color:var(--habit);color:#fff;box-shadow:0 3px 0 var(--habit-ink)}

/* editor sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(30,35,70,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:13px;max-height:90vh;overflow:auto}
@media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;color:var(--muted)}
.field input,.field textarea{border:2px solid var(--line);border-radius:14px;background:var(--bg-2);padding:8px 12px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn.danger{color:var(--danger)}

/* confetti */
.spark{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:30}

@media (prefers-reduced-motion:no-preference){
  .buddy svg{animation:bob 3.2s ease-in-out infinite}
  .buddy.hop svg{animation:hop .55s ease-out}
  .eye-open{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
  .zz{animation:zz 2.4s ease-in-out infinite}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.92)}100%{transform:translateY(0) scale(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes zz{0%,100%{opacity:.2;transform:translate(0,0)}50%{opacity:1;transform:translate(3px,-5px)}}
@media(max-width:460px){.garden{grid-template-columns:84px 1fr;gap:8px;padding:8px 12px 8px 4px}.buddy{width:84px;height:84px}.meter-top{font-size:12px}h1{font-size:22px}.title-row .jbtn{padding:4px 11px;font-size:13px}.tab{font-size:13.5px;padding:8px 2px;gap:4px}.tab .n{padding:0 6px}nav.tabs{gap:5px}.tab svg{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="title-row"><h1 id="appName">我的人生服务器</h1><span class="today" id="today"></span><button class="jbtn" id="jbtn" aria-pressed="false">📔 <span id="jbtnTxt">今日小结</span></button><button class="gear" id="gear" aria-label="设置">⚙️</button></div>
  <section class="garden" aria-label="小芽的成长">
    <div class="buddy" id="buddy" role="img" aria-label="小芽"></div>
    <div class="g-text">
      <div class="stage"><b id="stageName">小芽</b><span class="lv" id="stageLv">Lv.1</span><button class="forest-btn" id="forestBtn" aria-pressed="false">🌳 <span id="forestTxt">森林</span> <span class="fn" id="forestN">0</span></button></div>
      <div class="bubble"><span id="say">正在把你的东西搬过来…</span></div>
      <div class="meter">
        <div class="meter-top"><span>💧 <span class="w" id="water">0</span> <span id="dropsLbl">滴水</span></span><span id="nextTxt"></span></div>
        <div class="wbar"><i id="wbar" style="width:0%"></i></div>
      </div>
      <button class="btn primary" id="plantBtn" hidden>🌳 种进森林</button>
      <div class="status" id="status" hidden></div>
    </div>
  </section>


  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-k="habit"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="var(--habit)"/></svg><span class="tl" id="tl-habit">打卡</span> <span class="n" id="n-habit">0/0</span></button>
    <button class="tab" role="tab" data-k="life"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.6 12 20 12 20z" fill="var(--life)"/></svg><span class="tl" id="tl-life">生活</span> <span class="n" id="n-life">0</span></button>
    <button class="tab" role="tab" data-k="study"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.3c2.5-1.7 5.5-1.8 8-.8V19c-2.5-1-5.5-.9-8 .8-2.5-1.7-5.5-1.8-8-.8z" fill="var(--study)"/><path d="M12 6.3v13.5" stroke="#fff" stroke-width="1.6"/></svg><span class="tl" id="tl-study">学习</span> <span class="n" id="n-study">0</span></button>
    <button class="tab" role="tab" data-k="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="4" fill="var(--work)"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" stroke="var(--work)" stroke-width="2" fill="none"/><circle cx="12" cy="13" r="1.8" fill="#fff"/></svg><span class="tl" id="tl-work">工作</span> <span class="n" id="n-work">0</span></button>
  </nav>

  <main id="main"></main>
  <div class="cap-wrap" id="capWrap" hidden>
  <section class="capture" aria-label="快速记录">
    <div class="cap-head"><svg class="pen" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="20" rx="5" fill="var(--pink)"/><rect x="8" y="5" width="16" height="5" rx="2.5" fill="var(--buddy)"/><path d="M10 15h12M10 20h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><label for="cap" id="capLbl">想到什么就丢给我</label><button class="x" id="capClose" aria-label="关闭">×</button></div>
    <textarea id="cap" placeholder="例如：周五前改完简历投三家伦敦的公司；周末买洗衣液和鸡蛋；今年想把雅思口语练到 8"></textarea>
    <div class="cap-row">
      <button class="btn primary" id="parseBtn">✨ 自动分拣</button>
      <button class="btn" id="inboxBtn">先丢进收件箱</button>
      <span class="hint" id="capHint">按规则拆成几条、分到对应板块、换算日期，你确认后才保存。分错了点一下就能改。</span>
    </div>
    <div class="preview" id="preview" hidden></div>
  </section>
  </div>
  <button class="fab" id="fab" aria-label="记下一个想法" title="想到什么就丢给小芽"><svg viewBox="0 0 120 120" aria-hidden="true">
      <path d="M60 32C60 26 60 22 60 18" stroke="var(--leaf)" stroke-width="5" stroke-linecap="round"/>
      <path d="M60 22C51 22 44 17 44 9 53 9 59 14 60 22Z" fill="var(--leaf)"/><path d="M60 22C69 22 76 17 76 9 67 9 61 14 60 22Z" fill="var(--leaf-2)"/>
      <path d="M60 30C88 30 104 50 104 74 104 96 86 110 60 110 34 110 16 96 16 74 16 50 32 30 60 30Z" fill="var(--buddy)"/>
      <circle cx="44" cy="68" r="10" fill="var(--buddy-ink)"/><circle cx="76" cy="68" r="10" fill="var(--buddy-ink)"/>
      <circle cx="47.5" cy="64" r="4.2" fill="#fff"/><circle cx="79.5" cy="64" r="4.2" fill="#fff"/>
      <circle cx="40.5" cy="72" r="2" fill="#fff"/><circle cx="72.5" cy="72" r="2" fill="#fff"/>
      <ellipse cx="30" cy="84" rx="7" ry="4.5" fill="var(--pink)" opacity=".8"/><ellipse cx="90" cy="84" rx="7" ry="4.5" fill="var(--pink)" opacity=".8"/>
      <path d="M52 86q8 9 16 0z" fill="var(--buddy-ink)"/>
      <path class="tw" d="M100 18l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#fff"/>
      <path class="tw tw2" d="M20 26l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#fff"/>
      <path class="tw tw3" d="M110 50l1.4 3.2 3.2 1.4-3.2 1.4-1.4 3.2-1.4-3.2-3.2-1.4 3.2-1.4z" fill="var(--buddy)"/>
    </svg></button>
</div>

<script>
/* ---------- language ---------- */
let lang="zh";
try{lang=localStorage.getItem("lifeos-lang")||((navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en")}catch(e){lang=(navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en"}
const L=(zh,en)=>lang==="en"?en:zh;

/* ---------- which boards are switched on (per browser) ---------- */
const BOARDS_KEY="lifeos-boards";
const boards={habit:true,life:true,study:true,work:true,shop:true};
try{Object.assign(boards,JSON.parse(localStorage.getItem(BOARDS_KEY)||"{}"))}catch(e){}
const on=k=>k==="shop"?boards.life&&boards.shop:!!boards[k];
const taskSpaces=()=>["life","study","work"].filter(on);
const pickSpace=()=>taskSpaces().includes(tab)?tab:taskSpaces()[0];
function applyBoards(){
  const order=["habit","life","study","work"].filter(on);
  document.querySelectorAll(".tab").forEach(b=>b.hidden=!on(b.dataset.k));
  const nav=document.querySelector("nav.tabs"); if(nav)nav.style.gridTemplateColumns=`repeat(${order.length},1fr)`;
  if(tab!=="journal"&&tab!=="forest"&&!on(tab))tab=order[0];
  if(!on("shop"))lifeSub="goals";
  const fab=document.getElementById("fab"); if(fab)fab.hidden=!taskSpaces().length;
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDEN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const n_=(n,one,many)=>n===1?one:many;
const HZ=[
  {k:"inbox",name:"收件箱",sub:"刚记下，还没安排"},
  {k:"week",name:"近期",sub:"这周内"},
  {k:"month",name:"中期",sub:"这个月内"},
  {k:"long",name:"长期",sub:"慢慢长大的目标"}
];
const HZNAME=Object.fromEntries(HZ.map(h=>[h.k,h.name]));
const SPACE={work:"工作",life:"生活",study:"学习",shop:"购物"};
const PLUS='<svg viewBox="0 0 12 12"><path d="M6 1.5v9M1.5 6h9"/></svg>';
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.6L12 17.1l-5.9 3.3 1.3-6.6L2.5 9.3l6.6-.8z" fill="var(--habit)" stroke="var(--habit-ink)" stroke-width="1" stroke-linejoin="round"/></svg>';
const FLAME='<svg viewBox="0 0 24 24"><path d="M12 22c-4 0-6.5-2.7-6.5-6.2 0-3.3 2.6-5.3 3.8-8.3.3 2 1.4 3 2.4 3.4.3-3 1.6-5.6 4-7.4-.4 3 1 4.7 2.2 6.6 1 1.6 1.6 3.4 1.6 5.6C19.5 19.3 16.3 22 12 22z" fill="var(--habit)"/><path d="M12 22c-1.9 0-3.2-1.3-3.2-3 0-2 1.6-3 2.4-4.6.5 1.2 1.3 1.6 2 1.7.1-1 .5-1.9 1.1-2.5.7 1.4 1 2.6 1 3.6 0 2.2-1.4 4.8-3.3 4.8z" fill="var(--buddy)"/></svg>';

/* ---------- the growing buddy (original mascot) ---------- */
const STAGES=[
  {n:"种子",w:0},{n:"发芽",w:6},{n:"小芽",w:16},{n:"幼苗",w:32},{n:"小树",w:60},{n:"大树",w:120},{n:"开花的树",w:200}
];
const MAXW=STAGES[STAGES.length-1].w;
function stageOf(w){let i=0;STAGES.forEach((s,j)=>{if(w>=s.w)i=j});return i}
/* each grown tree keeps its own colours */
const THEMES={
  lemon:{zh:"柠檬黄",en:"Lemon",body:"#ffe08a",leaf:"#5cc98f",leaf2:"#3faa74",flower:"#ffffff"},
  sakura:{zh:"樱花粉",en:"Sakura",body:"#ffc6d8",leaf:"#6fcf97",leaf2:"#4fb07c",flower:"#ff7fa8"},
  mint:{zh:"薄荷绿",en:"Mint",body:"#bdf0d6",leaf:"#3fbf86",leaf2:"#2a9d6a",flower:"#ffe27a"},
  sky:{zh:"天空蓝",en:"Sky",body:"#c4e2ff",leaf:"#4cc3b0",leaf2:"#2fa595",flower:"#7fb2ff"},
  lavender:{zh:"薰衣草",en:"Lavender",body:"#e0d3ff",leaf:"#7ccf9a",leaf2:"#58b07c",flower:"#b493ff"},
  maple:{zh:"秋枫橙",en:"Maple",body:"#ffd3ae",leaf:"#ff9f5a",leaf2:"#ea7a3a",flower:"#ffd34d"},
};
const themeStyle=k=>{const t=THEMES[k]||THEMES.lemon;return `--buddy:${t.body};--leaf:${t.leaf};--leaf-2:${t.leaf2};--flower:${t.flower}`};
function face(mood,x,y,k){
  const ink="var(--buddy-ink)";let e,m,ex="";

function treeSVG(mood,level,bloom,theme){

  const canopy=cs=>cs.map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${i%2?"var(--leaf-2)":"var(--leaf)"}"/>`).join("")+cs.slice(0,1).map(([x,y,r])=>`<path d="M${x-r*.6} ${y-r*.35}q${r*.25} ${-r*.4} ${r*.65} ${-r*.45}" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".45"/>`).join("");
  const trunk=(y,w)=>`<path d="M${80-w/2} 150 L${80-w/2+3} ${y+8} Q80 ${y-4} ${80+w/2-3} ${y+8} L${80+w/2} 150Z" fill="var(--bark)"/>`;

    top=72; if(bloom)body+=flower(80,78,6);

    top=40; if(bloom)body+=flower(80,42,7);
  }else{
    const big={tw:50,ty:84,cs:[[80,50,40],[44,68,28],[116,68,28],[60,32,22],[100,32,22]],fy:115,fk:1.05,top:8};
    const T={4:{tw:36,ty:92,cs:[[80,62,34],[62,74,18],[98,74,18]],fy:120,fk:.82,top:28},
             5:{tw:40,ty:90,cs:[[80,59,36],[57,73,21],[103,73,21]],fy:118,fk:.88,top:23},
             6:{tw:44,ty:88,cs:[[80,56,38],[52,72,24],[108,72,24]],fy:117,fk:.95,top:18},
             7:big,8:big,9:big}[stage];
    body=trunk(T.ty,T.tw)+canopy(T.cs);
    fy=T.fy;fk=T.fk;top=T.top;
    if(stage===9){
      body+=[[56,46],[96,30],[110,60],[70,24],[42,72],[86,62],[122,74],[62,66]].map(([x,y],i)=>flower(x,y,i%3?5:6.5)).join("");
      body+=[[74,44],[104,46],[52,58]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--danger)"/><path d="M${x} ${y-4}l1.5 -3" stroke="var(--leaf-2)" stroke-width="1.6" stroke-linecap="round"/>`).join("");
    }else if(stage===8){

      body+=[[58,44],[98,32],[112,62],[72,26],[44,70],[88,60],[120,76]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3.2" ry="4.2" fill="var(--flower,var(--pink))"/><path d="M${x-2.6} ${y+2.4}q2.6 2.6 5.2 0" fill="var(--leaf-2)"/>`).join("");

  if(mood==="cheer")extra=`<g fill="var(--habit)"><path d="M22 ${top+20}l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M136 ${top+30}l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z"/><path d="M128 ${top+6}l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z"/></g>`;
  return `<svg viewBox="0 0 160 160" style="${themeStyle(theme||curTheme)}"><ellipse cx="80" cy="150" rx="${30+stage*4}" ry="6" fill="var(--soil)"/>${body}${face(mood,fx,fy,fk)}${extra}</svg>`;

function dueLabel(due){
  if(!due)return null;
  const diff=Math.round((new Date(due)-new Date(todayStr()))/864e5);
  let cls="", txt=L(due.slice(5).replace("-","/"),`${+due.slice(8)} ${MON[+due.slice(5,7)-1]}`);
  if(diff<0){cls="over";txt+=L(" 过期"," overdue")}else if(diff===0){cls="soon";txt=L("今天","Today")}else if(diff===1){cls="soon";txt=L("明天","Tomorrow")}else if(diff<=3)cls="soon";
  return {cls,txt};
}

/* ---------- buddy mood & growth ---------- */
function habitStats(){const td=checkins[todayStr()]||{};const live=on("habit")?habits.filter(h=>!h.archived):[];return {live,done:live.filter(h=>td[h.id]).length}}
// water is derived from the record itself: each finished task = 1 drop, each check-in = 2 drops
function waterTotal(){
  const t=tasks.filter(x=>x.done).length;
  let c=0; for(const d in checkins)c+=Object.keys(checkins[d]||{}).length;
  return t+c*2+trips.length;
}
function buddyState(){
  const {live,done}=habitStats();
  const w=curWater(), stage=stageOf(w), bloom=live.length>0&&done===live.length;
  const base={stage,bloom,w};
  if(thinking)return {...base,mood:"think",say:L("让我想想怎么分…","Let me think how to sort this…")};
  if(flash)return {...base,mood:flash.mood,say:flash.say};
  if(!loaded.t)return {...base,mood:"idle",say:L("正在把你的东西搬过来…","Bringing your things over…")};
  const h=new Date().getHours();
  const urgent=tasks.filter(t=>!t.done&&!t.deleted&&t.due&&t.due<=todayStr()).length;
  if(h<5)return {...base,mood:"sleepy",say:L(`已经凌晨 ${h} 点啦，记完就去睡吧，事情明天还在～`,`It's ${h} a.m. already. Jot it down and get some sleep, it'll all still be here tomorrow.`)};
  if(bloom)return {...base,mood:"cheer",say:L("今天的打卡全部完成！我开花啦 🌸","All check-ins done today! I'm blooming 🌸")};
  if(urgent)return {...base,mood:"idle",say:L(`有 ${urgent} 件今天到期或已经过期，先看看它们？`,`${urgent} ${n_(urgent,"thing is","things are")} due today or overdue. Take a look first?`)};
  if(h<11)return {...base,mood:"happy",say:L("早上好！完成一件事就能给我浇一滴水哦。","Good morning! Every task you finish gives me a drop of water.")};
  if(h<18)return {...base,mood:"idle",say:!on("habit")?L("下午好！完成一件事就能给我浇一滴水哦。","Good afternoon! Every task you finish gives me a drop of water."):done?L(`今天打卡 ${done} 个了，喝饱了～`,`${done} check-in${done===1?"":"s"} today, I'm nicely watered～`):L("下午好，打个卡给我浇点水？","Good afternoon! Check in to give me some water?")};
  if(!(journal[todayStr()]||{}).note)return {...base,mood:"happy",say:L("晚上好，今天辛苦了。点右上角「今日小结」看看你今天做了什么吧。","Good evening, you worked hard today. Tap Today at the top to see what you got done.")};
  return {...base,mood:"happy",say:L("晚上好，今天辛苦了。还有什么想记下来的吗？","Good evening, you worked hard today. Anything else to jot down?")};
}

function levelUp(st){

  setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/3,[css("--leaf"),css("--pink"),css("--habit")]),250);
  cheer(L(`我长成「${STAGES[st].n}」啦！谢谢你一直浇水 🎉`,`I'm now a ${STAGES[st].n.toLowerCase()}! Thanks for all the water 🎉`),"cheer");

function water(fromEl,n){
  const g=$("#buddy"), gr=g.getBoundingClientRect();
  const plus=()=>{const p=document.createElement("span");p.className="plus";p.textContent="+"+n+" 💧";
    p.style.left=(g.offsetLeft+gr.width/2-20)+"px";p.style.top=(g.offsetTop+10)+"px";g.parentElement.appendChild(p);
    p.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-28px)",opacity:0}],{duration:1100,easing:"ease-out"}).onfinish=()=>p.remove()};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!fromEl){plus();return}
  const fr=fromEl.getBoundingClientRect();
  const x0=fr.left+fr.width/2-10,y0=fr.top+fr.height/2-12,x1=gr.left+gr.width/2-10,y1=gr.top+gr.height*.3;
  const d=document.createElement("span");d.className="drop";d.textContent="💧";document.body.appendChild(d);
  const mx=(x0+x1)/2,my=Math.min(y0,y1)-60;
  d.animate([{transform:`translate(${x0}px,${y0}px) scale(.8)`},{transform:`translate(${mx}px,${my}px) scale(1.15)`},{transform:`translate(${x1}px,${y1}px) scale(.6)`,opacity:.9}],{duration:700,easing:"ease-in-out"}).onfinish=()=>{d.remove();plus()};
}

function burst(x,y,colors){

function shopBoard(){

const SHOP_RE=/(买|购买|采购|补货|囤|入手|补一下|补点)|\b(buy|grab|pick up|purchase|restock|shop for)\b/i;
const isAscii=w=>/^[\x00-\x7f]+$/.test(w);
const escRe=w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const hit=(t,w)=>w instanceof RegExp?w.test(t):isAscii(w)?new RegExp("\\b"+escRe(w)+"s?\\b","i").test(t):t.includes(w);
const has=(t,list)=>list.reduce((n,w)=>n+(hit(t,w)?1:0),0);
const WDMAP={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0,"末":6};
const ENWD={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6,sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const ENMON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
const CN={"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
const toNum=s=>/^\d+$/.test(s)?+s:(s.length===2&&s[0]==="十"?10+CN[s[1]]:s.length===2&&s[1]==="十"?CN[s[0]]*10:s.length===3?CN[s[0]]*10+CN[s[2]]:CN[s]);
const ENNUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,a:1};

// returns {due, rest} where rest is the text with the date phrase removed
function pickDate(text,today,dayFirst){
  const [Y,M,D]=today.split("-").map(Number); const base=new Date(Y,M-1,D);
  const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const plus=n=>{const d=new Date(base);d.setDate(d.getDate()+n);return fmt(d)};
  const md=(mm,dd)=>{let d=new Date(Y,mm-1,dd);if(d<base)d=new Date(Y+1,mm-1,dd);return fmt(d)};
  const toWeekday=(w,mode)=>{const mon=(base.getDay()+6)%7, target=(w+6)%7; let diff=target-mon;
    if(mode==="nn")diff+=14; else if(mode==="next")diff+=7; else if(mode!=="this"&&diff<0)diff+=7; else if(mode==="this"&&diff<0)diff+=7; return plus(diff)};
  const tail="(?:之前|以前|前|之内|以内|内|左右)?";
  const pre="(?:\\b(?:by|before|on|at|due|until|for)\\s+)?";
  const wdNames=Object.keys(ENWD).sort((a,b)=>b.length-a.length).join("|");
  const monNames=Object.keys(ENMON).sort((a,b)=>b.length-a.length).join("|");
  const tries=[
    // Chinese
    [new RegExp("(今天|今晚|今早|今日)"+tail),()=>plus(0)],
    [new RegExp("大后天"+tail),()=>plus(3)],
    [new RegExp("后天"+tail),()=>plus(2)],
    [new RegExp("(明天|明早|明晚|明日)"+tail),()=>plus(1)],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*(?:天|日)(?:后|之后|内|以内)"),m=>plus(toNum(m[1]))],
    [new RegExp("(下下|下个?|这个?|本)?(?:周|星期|礼拜)([一二三四五六日天末])"+tail),m=>toWeekday(WDMAP[m[2]],m[1]?(m[1].startsWith("下下")?"nn":m[1].startsWith("下")?"next":"this"):"")],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*月\\s*(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*[日号]?"+tail),m=>md(toNum(m[1]),toNum(m[2]))],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*号"+tail),m=>{const dd=toNum(m[1]);let d=new Date(Y,M-1,dd);if(d<base)d=new Date(Y,M,dd);return fmt(d)}],
    [new RegExp("月底"+tail),()=>fmt(new Date(Y,M,0))],
    [new RegExp("(这周|本周)"+tail),()=>plus((7-base.getDay())%7)],
    [new RegExp("下周"+tail),()=>plus(((7-base.getDay())%7)+7)],
    // English
    [new RegExp(pre+"\\b(?:the\\s+)?day after tomorrow\\b","i"),()=>plus(2)],
    [new RegExp(pre+"\\b(?:today|tonight|this (?:morning|afternoon|evening))\\b","i"),()=>plus(0)],
    [new RegExp(pre+"\\b(?:tomorrow|tmr|tmrw)\\b(?:\\s+(?:morning|afternoon|evening|night))?","i"),()=>plus(1)],
    [new RegExp("\\b(?:in|within)\\s+(\\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|a)\\s+days?\\b","i"),m=>plus(/\d/.test(m[1])?+m[1]:ENNUM[m[1].toLowerCase()])],
    [new RegExp("\\b(?:in|within)\\s+(\\d|one|two|three|a)\\s+weeks?\\b","i"),m=>plus(7*(/\d/.test(m[1])?+m[1]:ENNUM[m[1].toLowerCase()]))],
    [new RegExp(pre+"\\b(this|next)?\\s*weekend\\b","i"),m=>toWeekday(6,m[1]&&m[1].toLowerCase()==="next"?"next":"")],
    [new RegExp(pre+"\\b(this|next|coming)?\\s*("+wdNames+")\\b","i"),m=>toWeekday(ENWD[m[2].toLowerCase()],m[1]&&m[1].toLowerCase()==="next"?"next":m[1]&&m[1].toLowerCase()==="this"?"this":"")],
    [new RegExp(pre+"\\b("+monNames+")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b","i"),m=>md(ENMON[m[1].toLowerCase()],+m[2])],
    [new RegExp(pre+"\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?("+monNames+")\\b","i"),m=>md(ENMON[m[2].toLowerCase()],+m[1])],
    [new RegExp(pre+"\\b(\\d{1,2})[/.](\\d{1,2})\\b"+tail),m=>dayFirst?md(+m[2],+m[1]):md(+m[1],+m[2])],
    [new RegExp(pre+"\\b(?:the\\s+)?end of (?:the\\s+)?month\\b|\\beom\\b","i"),()=>fmt(new Date(Y,M,0))],
    [new RegExp(pre+"\\b(?:the\\s+)?end of (?:the\\s+)?week\\b|\\bthis week\\b","i"),()=>plus((7-base.getDay())%7)],
    [new RegExp(pre+"\\bnext week\\b","i"),()=>plus(((7-base.getDay())%7)+7)],
  ];
  for(const [re,fn] of tries){const m=text.match(re);if(m){const due=fn(m);if(due&&!/NaN|undefined/.test(due))return {due,rest:text.replace(m[0]," ")}}}
  return {due:null,rest:text};
}
function cleanTitle(t){
  t=t.replace(/^\s*(?:今年|明年|这个月|本月|下个月|最近|近期|这周|本周|以后|将来)/,"")
     .replace(/^[\s，,。、:：;；]*(?:我|今天|还)?(?:要|得|需要|记得|别忘了|别忘记|想|打算|准备|计划|必须|一定要)+/,"")
     .replace(/^(?:去|把)?\s*/,m=>m.trim()==="把"?"":m);
  t=t.replace(/^\s*(?:and\s+|also\s+|then\s+)?(?:i\s+)?(?:really\s+)?(?:need to|have to|has to|must|should|gotta|got to|want to|wanna|plan to|planning to|remember to|don'?t forget to|try to|will|'ll|am going to|i'm going to|going to)\s+/i,"")
     .replace(/^\s*(?:to|i)\s+/i,"")
     .replace(/\s+(?:by|before|on|at|in|due|until|this|next|for)\s*$/i,"");
  t=t.replace(/[\s，,。、;；!！?？~～.]+$/,"").replace(/\s{2,}/g," ").trim();
  return /^[a-z]/.test(t)?t[0].toUpperCase()+t.slice(1):t;
}
function shopItems(part){
  return part.split(/[、，,&\/]|和|跟|与|及|以及|\band\b|\bplus\b/i)
    .map(x=>x.replace(/^\s*(?:一下|点|些|一些|个)/,"")
      .replace(/^(?:一|两|几)?(?:瓶|包|袋|盒|个|斤|打|箱|罐|卷|点|些)/,"")
      .replace(/^\s*(?:some|more|a few|a couple of|a|an|the|\d+x?|one|two|three|a bottle of|bottles of|a pack of|packs of|a bag of|bags of|a box of|boxes of|a dozen|a carton of|a loaf of|a tin of|cans? of)\s+/i,"")
      .replace(/\s+(?:from|at)\s+.*$/i,"")
      .replace(/[\s，,。!！~～.]+$/,"").trim())
    .filter(x=>x&&x.length<=30&&!/^(?:超市|东西|stuff|things|groceries|shopping|supermarket)$/i.test(x));
}
function ruleParse(text,today,fallback="life",dayFirst=false){
  const chunks=text.split(/[\n。；;！!？?]+|\.\s+|(?:还有|另外|然后|顺便|再就是)|\b(?:then|also|and then|plus also)\b/i).map(x=>x&&x.trim()).filter(Boolean);
  const out=[];
  const addTask=raw=>{
    const {due,rest}=pickDate(raw,today,dayFirst);
    const title=cleanTitle(rest); if(!title)return;
    const s=has(raw,RULES.study), w=has(raw,RULES.work);
    const space=s>w?"study":w>s?"work":s&&w?"study":fallback;
    let horizon="inbox";
    if(due){const diff=Math.round((new Date(due)-new Date(today))/864e5);horizon=diff<=7?"week":diff<=31?"month":"long"}
    else if(has(raw,RULES.week))horizon="week";
    else if(has(raw,RULES.month))horizon="month";
    else if(has(raw,RULES.long))horizon="long";
    out.push({title:title.slice(0,200),space,horizon,due,note:"",keep:true});
  };
  const isTaskish=x=>has(x,RULES.study)||has(x,RULES.work);
  for(const chunk of chunks){
    const sm=chunk.match(SHOP_RE);
    if(sm){
      // the items run from "buy" until a comma-part that looks like a separate task (study/work words or its own date)
      const segs=chunk.slice(sm.index+sm[0].length).split(/[，,]/), shopSegs=[];
      let i=0;
      for(;i<segs.length;i++){const sg=segs[i]; if(isTaskish(sg)||(i>0&&pickDate(sg,today,dayFirst).due))break; shopSegs.push(sg)}
      if(shopSegs.length){
        // everything before the buy-clause is ordinary tasks; the clause that holds "buy" is just the errand itself
        const parts=chunk.slice(0,sm.index).split(/[，,]/);
        const lead=parts.pop();
        parts.forEach(addTask);
        if(lead&&isTaskish(lead))addTask(lead);
        shopItems(pickDate(shopSegs.join(","),today,dayFirst).rest).forEach(name=>out.push({title:name,space:"shop",horizon:"week",due:null,note:"",keep:true}));
        segs.slice(i).forEach(addTask);
        continue;
      }
    }
    chunk.split(/[，,]\s*(?=\S)/).forEach(addTask);
  }
  return out;
}

const MEADOW_ROWS=[
  {b:118,s:50,x:[30,90,150,210,270,330]},
  {b:148,s:62,x:[50,120,190,260,320]},
  {b:186,s:78,x:[45,135,225,315]},

const MEADOW_ORDER=[[2,1],[2,2],[1,1],[1,3],[2,0],[2,3],[3,0],[3,2],[1,0],[1,2],[1,4],[0,1],[0,3],[0,5],[0,0],[0,2],[0,4]];

function meadowSpot(i){

  const k=i-MEADOW_ORDER.length, perRow=11, row=Math.floor(k/perRow), col=k%perRow;
  return {cx:18+col*32+(row%2?16:0)+(jit(i)-.5)*8, b:104-row*6+(jit(i+3)-.5)*4, s:Math.max(30,40-row*4)};

/* ---------- capture & AI parsing ---------- */
function renderPreview(){
  const box=$("#preview");
  if(!pending.length){box.hidden=true;box.innerHTML="";return}
  box.hidden=false;
  box.innerHTML=pending.map((p,i)=>`<div class="pv">
    <input type="checkbox" id="pv-c-${i}" data-pv="keep" data-i="${i}" ${p.keep?"checked":""} aria-label="${L("保留这条","Keep this")}">
    <div class="pv-body">
      <input class="pv-title" id="pv-t-${i}" data-pv="title" data-i="${i}" value="${esc(p.title)}" aria-label="${L("任务标题","Task title")}">
      <div class="chips">
        ${["life","study","work","shop"].filter(on).map(s=>`<button class="chip ${s==="shop"?"life":s}${p.space===s?" on":""}" data-pv="space" data-v="${s}" data-i="${i}">${s==="shop"?"🛒 "+SPACE.shop:SPACE[s]}</button>`).join("")}
        ${p.space==="shop"?"":`<span class="gap"></span>`+HZ.map(h=>`<button class="chip hz${p.horizon===h.k?" on":""}" data-pv="hz" data-v="${h.k}" data-i="${i}">${h.name}</button>`).join("")}
        ${p.due?`<span class="chip">${L("截止 ","Due ")}${esc(p.due)}</span>`:""}
      </div>
    </div></div>`).join("")+
  `<div class="cap-row"><button class="btn primary" id="saveParsed">${L(`保存选中的 ${pending.filter(p=>p.keep).length} 条`,`Save ${pending.filter(p=>p.keep).length} selected`)}</button><button class="btn" id="cancelParsed">${L("取消","Cancel")}</button></div>`;
}
async function parseCapture(){
  const text=$("#cap").value.trim(); if(!text)return;
  if(!sample){
    pending=ruleParse(text,todayStr(),pickSpace(),lang==="en").map(p=>{
      if(p.space==="shop"&&!on("shop"))p={...p,space:"life",title:L("买","Buy ")+p.title};
      if(!on(p.space))p={...p,space:pickSpace()};
      return p});
    if(pending.length)cheer(L(`分好啦，一共 ${pending.length} 条，看看对不对？`,`Sorted into ${pending.length} ${n_(pending.length,"item","items")}. Look right?`));
    else $("#capHint").textContent=L("没分出任务，换个说法试试，或者先丢进收件箱。","Couldn't find anything to sort. Try rewording, or put it in the inbox.");
    renderPreview();return}
  const btn=$("#parseBtn"); btn.disabled=true; btn.textContent="分拣中…"; thinking=true; renderBuddy();
  const t=todayStr();
  const prompt=`你是一个个人任务整理助手。今天是 ${t}（周${WD[new Date().getDay()]}）。
把用户随手写的一段话拆成独立的待办事项。每条返回：
- title：简洁的中文动作描述（保留用户原意和专有名词）
- space："study"（课程、作业、笔记整理、考试复习、刷题、自学新技能）、"work"（求职、实习、工作项目、职业发展目标）、"shop"（要去超市或商店买的具体物品，每样东西单独一条，title 只写物品名，比如"鸡蛋"）或 "life"（其他生活事项和目标：健康、社交、家务、爱好）
- horizon："week"（7 天内或很快要做）、"month"（一个月内）、"long"（长期目标或没有明确时间的大事）、"inbox"（实在无法判断）
- due：如果提到具体或相对日期，换算成 YYYY-MM-DD；否则为 null
- note：用户提到的额外细节，没有则为空字符串
只返回 JSON 数组，不要其他文字。

用户输入：
${text}`;
  try{
    const out=await sample.json(prompt,{modelTier:"quick"});
    const arr=Array.isArray(out)?out:(out&&Array.isArray(out.tasks)?out.tasks:[]);
    pending=arr.filter(x=>x&&x.title).map(x=>({
      title:String(x.title).slice(0,200),
      space:["life","shop","study"].includes(x.space)?x.space:"work",
      horizon:HZNAME[x.horizon]?x.horizon:"inbox",
      due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||"")?x.due:null,
      note:String(x.note||"").slice(0,500),keep:true}));
    thinking=false;
    if(pending.length)cheer(`分好啦，一共 ${pending.length} 条，看看对不对？`);
    else $("#capHint").textContent="没分出任务，换个说法试试，或者先丢进收件箱。";
    renderPreview();
  }catch(e){
    $("#capHint").textContent= e&&e.code==="not_granted"?"你没有允许 AI 分拣，可以先丢进收件箱。":e&&e.code==="rate_limited"?"请求太频繁了，过一会儿再试。":"分拣没成功，再试一次或者先丢进收件箱。";
    if(e&&e.code==="not_granted"){sample=null;$("#parseBtn").hidden=true}
  }finally{thinking=false;btn.disabled=false;btn.textContent="✨ 自动分拣";renderBuddy()}
}
async function addTask(t){
  const ref=db.collection("tasks").doc();
  const body={title:t.title,space:t.space,horizon:t.horizon,due:t.due||null,note:t.note||"",done:false,createdAt:Date.now()};
  return queued(ref.path,()=>ref.set(body));
}
async function addInbox(){
  const text=$("#cap").value.trim(); if(!text||!db)return;
  const space=pickSpace();
  await addTask({title:text.slice(0,200),space,horizon:"inbox"});
  $("#cap").value=""; closeCap(); if(tab==="habit"){tab=space;render()}
  cheer(L(`收到！放进${SPACE[space]}收件箱了。`,`Got it! Added to the ${SPACE[space].toLowerCase()} inbox.`));
}

/* ---------- shopping ---------- */
const norm=x=>x.trim().toLowerCase();
async function addShop(name){
  name=name.trim().slice(0,80); if(!name)return;
  if(shop.some(x=>norm(x.name)===norm(name)&&!x.bought))return;
  const ref=db.collection("shop").doc();
  return queued(ref.path,()=>ref.set({name,bought:false,createdAt:Date.now()}));
}
async function addStaple(name){
  name=name.trim().slice(0,40); if(!name||staples.some(x=>norm(x.name)===norm(name)))return;
  const ref=db.collection("staples").doc();
  return queued(ref.path,()=>ref.set({name,order:Date.now(),createdAt:Date.now()}));
}
const splitItems=t=>t.split(/[,，、;；\n]+/).map(x=>x.trim()).filter(Boolean);

/* ---------- editor sheet ---------- */
function openEditor(id,preset){
  const isNew=!id; const t=isNew?null:tasks.find(x=>x.id===id); if(!isNew&&!t)return;
  const draft=isNew?{title:"",due:"",note:"",space:preset.space,horizon:preset.horizon}:{title:t.title,due:t.due||"",note:t.note||"",space:t.space,horizon:t.horizon};
  let confirmDel=false;
  const bg=document.createElement("div"); bg.className="sheet-bg";
  const draw=()=>{bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${L("编辑任务","Edit task")}">
    <h3>${isNew?L("添加一条","Add a task"):L("改一改","Edit")}</h3>
    <label class="field"><span>${isNew?L("要做什么？","What needs doing?"):L("标题","Title")}</span><input id="ed-title" value="${esc(draft.title)}" placeholder="${L("比如：整理 Week 6 笔记","e.g. Tidy up week 6 notes")}"></label>
    <div class="field"><span>${L("时间尺度","Timeframe")}</span><div class="chips">${HZ.map(h=>`<button class="chip hz${draft.horizon===h.k?" on":""}" data-ed="hz" data-v="${h.k}">${h.name}</button>`).join("")}</div></div>
    <label class="field"><span>${L("截止日期","Due date")}</span><input type="date" id="ed-due" value="${esc(draft.due)}"></label>
    <label class="field"><span>${L("备注 / 计划细节","Notes / plan details")}</span><textarea id="ed-note">${esc(draft.note)}</textarea></label>
    <div class="sheet-actions">
      ${isNew?"<span></span>":`<button class="btn danger" data-ed="del">${confirmDel?L("再点一次确认删除","Tap again to delete"):L("删除","Delete")}</button>`}
      <span style="display:flex;gap:8px"><button class="btn" data-ed="close">${L("取消","Cancel")}</button><button class="btn primary" data-ed="save">${isNew?L("添加","Add"):L("保存","Save")}</button></span>
    </div></div>`};
  const grab=()=>{draft.title=bg.querySelector("#ed-title").value;draft.due=bg.querySelector("#ed-due").value;draft.note=bg.querySelector("#ed-note").value};
  draw(); document.body.appendChild(bg);
  bg.addEventListener("click",e=>{
    if(e.target===bg){bg.remove();return}
    const b=e.target.closest("[data-ed]"); if(!b)return;
    const a=b.dataset.ed; grab();
    if(a==="space"){draft.space=b.dataset.v;draw();return}
    if(a==="hz"){draft.horizon=b.dataset.v;draw();return}
    if(a==="close"){bg.remove();return}
    if(a==="del"){if(!confirmDel){confirmDel=true;draw();return}
      bg.remove(); const ref=db.doc("tasks/"+id); queued(ref.path,()=>t.done?ref.update({deleted:true}):ref.delete()); return}
    if(a==="save"){
      if(isNew){const title=draft.title.trim();if(!title){bg.querySelector("#ed-title").focus();return}
        bg.remove();addTask({title:title.slice(0,200),space:draft.space,horizon:draft.horizon,due:draft.due||null,note:draft.note.slice(0,2000)});cheer(L(`加进${SPACE[draft.space]}的「${HZNAME[draft.horizon]}」了～`,`Added to ${SPACE[draft.space]} · ${HZNAME[draft.horizon]}～`));return}
      bg.remove();
      const ref=db.doc("tasks/"+id);
      queued(ref.path,()=>ref.update({title:(draft.title.trim()||L("未命名","Untitled")).slice(0,200),space:draft.space,horizon:draft.horizon,due:draft.due||null,note:draft.note.slice(0,2000)}))}
  });
  bg.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ed-title"){e.preventDefault();bg.querySelector('[data-ed="save"]').click()}if(e.key==="Escape")bg.remove()});
  bg.querySelector("#ed-title").focus();
}

  const st=L(["种子","发芽","小芽","幼苗","小树","大树","开花的树"],["Seed","Sprouting","Sprout","Seedling","Young tree","Big tree","Blooming tree"]);

/* ---------- local storage (this browser only) ---------- */
const LS_KEY="lifeos-data-v1", NAME_KEY="lifeos-name";
let userName=""; try{userName=localStorage.getItem(NAME_KEY)||""}catch(e){}
function applyName(){const t=userName?L(`${userName} 的人生服务器`,`${userName}'s Life Server`):L("我的人生服务器","My Life Server");$("#appName").textContent=t;document.title=t.replace(" 的","的")}
function makeLocalDB(){
  let data={}, firstRun=false;
  try{const raw=localStorage.getItem(LS_KEY);if(raw)data=JSON.parse(raw);else firstRun=true}catch(e){firstRun=true}
  const listeners=[];
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){setStatus(L("浏览器存储满了，先导出备份再清理一些已完成的内容。","Browser storage is full. Export a backup, then clear out some finished items."))}};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=col=>{const c=data[col]||{};const docs=Object.keys(c).map(id=>({id,exists:true,data:()=>c[id],metadata:meta}));return {docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}};
  const emit=col=>listeners.filter(l=>l.col===col).forEach(l=>l.cb(snap(col)));
  const emitAll=()=>[...new Set(listeners.map(l=>l.col))].forEach(emit);
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const clone=x=>JSON.parse(JSON.stringify(x));
  const docRef=(col,id)=>({id,path:col+"/"+id,
    async get(){const v=(data[col]||{})[id];return {id,exists:!!v,data:()=>v,metadata:meta}},
    async set(b){(data[col]=data[col]||{})[id]=clone(b);save();emit(col)},
    async update(b){const c=data[col]||{};if(!c[id])throw {code:"invalid_argument"};c[id]={...c[id],...clone(b)};save();emit(col)},
    async delete(){if(data[col])delete data[col][id];save();emit(col)}});
  const colRef=col=>{const q={path:col,doc:id=>docRef(col,id||rid()),orderBy:()=>q,limit:()=>q,
    onSnapshot(cb){const l={col,cb};listeners.push(l);setTimeout(()=>cb(snap(col)),0);return ()=>{const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}};return q};
  // keep two open tabs in step
  window.addEventListener("storage",e=>{if(e.key===LS_KEY){try{data=JSON.parse(e.newValue||"{}")}catch(_){data={}}emitAll()}});
  return {firstRun,doc:p=>{const [c,i]=p.split("/");return docRef(c,i)},collection:colRef,
    dump:()=>clone(data),replace:d=>{data=clone(d);save();emitAll()}};
}

  w("habits","ex1",{name:L("（示例）背 30 个单词","(Example) Read for 30 minutes"),archived:false,order:1,createdAt:now});
  w("habits","ex2",{name:L("（示例）运动 20 分钟","(Example) Move for 20 minutes"),archived:false,order:2,createdAt:now});
  w("tasks","ex1",{title:L("（示例）整理这周的课堂笔记","(Example) Tidy up this week's lecture notes"),space:"study",horizon:"week",due:null,note:L("示例任务，点开可以删除","Example task, tap to delete"),done:false,createdAt:now});
  w("tasks","ex2",{title:L("（示例）养成每周运动 3 次的习惯","(Example) Work out 3 times a week"),space:"life",horizon:"long",due:null,note:"",done:false,createdAt:now});
  w("tasks","ex3",{title:L("（示例）更新一版简历","(Example) Update my CV"),space:"work",horizon:"month",due:null,note:"",done:false,createdAt:now});

function openSettings(){
  let confirmWipe=false;
  const bg=document.createElement("div"); bg.className="sheet-bg";
  const draw=()=>{bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${L("设置","Settings")}">
    <h3>${L("设置","Settings")}</h3>
    <div class="field"><span>${L("语言","Language")}</span><div class="chips">${langChips()}</div></div>
    <div class="field"><span>${L("板块","Boards")}</span><div class="chips">${boardChips()}</div>
      <p class="hint" style="margin:0">${L("关掉用不到的板块，里面的数据不会删除，随时可以再打开。","Turn off what you don't need. Nothing inside is deleted, and you can turn it back on anytime.")}</p>
      <span class="saved" id="board-msg"></span></div>
    <label class="field"><span>${L("你的名字","Your name")}</span><input id="set-name" value="${esc(userName)}" maxlength="20" placeholder="${L("比如：Gracy","e.g. Gracy")}"></label>
    <div class="field"><span>${L("备份","Backup")}</span>
      <p class="hint" style="margin:0">${L("数据只存在这个浏览器里。换手机、换浏览器或清理浏览器数据之前，先导出一份备份。","Your data lives only in this browser. Export a backup before switching phones or browsers, or clearing browser data.")}</p>
      <div class="cap-row"><button class="btn" data-set="export">${L("导出备份","Export backup")}</button><label class="btn" style="cursor:pointer">${L("导入备份","Import backup")}<input type="file" id="set-import" accept="application/json,.json" hidden></label></div>
      <span class="saved" id="set-msg"></span>
    </div>
    <div class="sheet-actions">
      <button class="btn danger" data-set="wipe">${confirmWipe?L("再点一次，清空全部数据","Tap again to erase everything"):L("清空全部数据","Erase all data")}</button>
      <span style="display:flex;gap:8px"><button class="btn" data-set="close">${L("取消","Cancel")}</button><button class="btn primary" data-set="save">${L("保存","Save")}</button></span>
    </div></div>`};
  draw(); document.body.appendChild(bg);
  const msg=t=>{const el=bg.querySelector("#set-msg");if(el)el.textContent=t};
  bg.addEventListener("click",e=>{
    if(e.target===bg){bg.remove();return}
    const b=e.target.closest("[data-set]"); if(!b)return; const a=b.dataset.set;
    if(a==="board"){
      const k=b.dataset.v, mains=["habit","life","study","work"].filter(x=>boards[x]);
      if(k!=="shop"&&boards[k]&&mains.length===1){const el=bg.querySelector("#board-msg");if(el)el.textContent=L("至少要保留一个板块哦。","Keep at least one board on.");return}
      boards[k]=!boards[k]; try{localStorage.setItem(BOARDS_KEY,JSON.stringify(boards))}catch(_){}
      const n=bg.querySelector("#set-name").value; draw(); bg.querySelector("#set-name").value=n; render(); return}
    if(a==="lang"){const n=bg.querySelector("#set-name").value;setLang(b.dataset.v);draw();bg.querySelector("#set-name").value=n;return}
    if(a==="close"){bg.remove();return}
    if(a==="save"){const n=bg.querySelector("#set-name").value.trim();if(n){userName=n;try{localStorage.setItem(NAME_KEY,n)}catch(_){};applyName()}bg.remove();return}
    if(a==="export"){
      const blob=new Blob([JSON.stringify({app:"lifeos",version:1,name:userName,exportedAt:new Date().toISOString(),data:db.dump()},null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob); const link=document.createElement("a");
      link.href=url; link.download=L(`人生服务器备份-${todayStr()}.json`,`life-server-backup-${todayStr()}.json`); document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000); msg(L("已导出 ✓","Exported ✓"));return}
    if(a==="wipe"){if(!confirmWipe){confirmWipe=true;draw();return}db.replace({});bg.remove();cheer(L("数据清空了，我们重新开始吧 🌱","All cleared. Let's start fresh 🌱"));return}
  });
  bg.addEventListener("change",e=>{
    if(e.target.id!=="set-import")return; const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=="lifeos"||typeof j.data!=="object")throw 0;
      db.replace(j.data); if(j.name){userName=j.name;try{localStorage.setItem(NAME_KEY,j.name)}catch(_){};applyName()}
      bg.remove(); cheer(L("备份导入好啦，东西都回来了！","Backup restored, everything's back!"))}catch(_){msg(L("这个文件不是人生服务器的备份，换一个试试。","That file isn't a Life Server backup. Try another one."))}};
    r.readAsText(f);
  });
}

    <label class="field"><span>${L("我该怎么称呼你？","What should I call you?")}</span><input id="wel-name" maxlength="20" placeholder="${L("你的名字或昵称","Your name or nickname")}"></label>
    <p class="hint" style="margin:0">${L("你的数据只存在这个浏览器里，别人看不到。名字以后可以在右上角 ⚙️ 里改。","Your data stays in this browser and no one else can see it. You can change your name later in ⚙️ at the top.")}</p>
    <div class="sheet-actions"><button class="btn" data-w="skip">${L("先跳过","Skip for now")}</button><button class="btn primary" data-w="ok">${L("开始种树","Start growing")}</button></div>
  </div>`;bg.querySelector("#wel-name").value=keepName};
  draw();
  document.body.appendChild(bg);
  const done=()=>{try{localStorage.setItem("lifeos-welcomed","1")}catch(_){};bg.remove()};
  const ok=()=>{const n=bg.querySelector("#wel-name").value.trim();if(n){userName=n;try{localStorage.setItem(NAME_KEY,n)}catch(_){};applyName();cheer(L(`${n}，很高兴认识你！`,`Nice to meet you, ${n}!`))}done()};
  bg.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b)return;if(b.dataset.w==="lang"){setLang(b.dataset.v);draw();bg.querySelector("#wel-name").focus();return}b.dataset.w==="ok"?ok():done()});
  bg.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ok()}});
  setTimeout(()=>bg.querySelector("#wel-name").focus(),50);
}

(()=>{
  buildStrings(); applyStatic(); applyName();
  db=makeLocalDB(); sample=null;
  if(db.firstRun)seed();
  let welcomed=false; try{welcomed=!!localStorage.getItem("lifeos-welcomed")}catch(_){}
  if(!userName&&!welcomed)openWelcome();
  const ok=()=>{}, fail=()=>{};
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.t=true;render();ok()},fail);
  db.collection("habits").onSnapshot(s=>{habits=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.h=true;render();ok()},fail);
  db.collection("shop").onSnapshot(s=>{shop=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.s=true;render()},fail);
  db.collection("staples").onSnapshot(s=>{staples=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection("trips").onSnapshot(s=>{trips=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection("forest").onSnapshot(s=>{forest=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.f=true;render()},fail);
  db.collection("garden").onSnapshot(s=>{const g=s.docs.find(d=>d.id==="current");if(g&&THEMES[g.data().theme])curTheme=g.data().theme;render()},fail);
  db.collection("journal").orderBy("date","desc").limit(400).onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();m[x.date||d.id]=x});
    // keep a note that is still being typed instead of the older stored copy
    const el=document.activeElement; if(el&&el.dataset&&el.dataset.jnote&&m[el.dataset.jnote])m[el.dataset.jnote]={...m[el.dataset.jnote],note:el.value};
    journal=m;render()},fail);
  db.collection("checkins").orderBy("date","desc").limit(400).onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();m[x.date||d.id]=x.done||{}});checkins=m;if(!s.metadata.fromCache)loaded.c=true;render();ok()},fail);
})();
