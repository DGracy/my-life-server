<style>
/* Layout: a sky-blue playroom — the sprout buddy greets you up top, a puffy capture card, three pastel boards behind bubbly tabs */
:root{
  --bg:#eaf4ff; --bg-2:#f6faff; --surface:#ffffff; --surface-2:#edf4fe; --line:#d3e3f7;
  --fg:#1f3156; --muted:#5b7099; --faint:#9db0cf;
  --work:#3a8bff; --work-soft:#e0eeff; --work-ink:#1f66d1; --brand:#2f7cf6; --brand-ink:#1b5fc4; --title:#1b5fc4;
  --life:#2fb38a; --life-soft:#dcf6ec; --life-ink:#1f8a69;
  --study:#8b6cf0; --study-soft:#efeaff; --study-ink:#6447d1;
  --habit:#ff9a3d; --habit-soft:#ffeedd; --habit-ink:#d86f12;
  --pink:#ff8fb1; --buddy:#ffe08a; --buddy-ink:#3a3350; --leaf:#5cc98f; --leaf-2:#3faa74; --bark:#e3a86f; --soil:#c9b49a; --water:#4aa8ff;
  --danger:#ef5d6e; --shadow:0 6px 0 rgba(47,124,246,.12);
  --f-display:"ZCOOL KuaiLe","Fredoka","Noto Sans SC",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]):not([data-tod]){
  --bg:#0f1a2e; --bg-2:#14223b; --surface:#1a2a47; --surface-2:#223558; --line:#2c4269;
  --fg:#eaf2ff; --muted:#a3b7d8; --faint:#6a82aa;
  --work:#6fb0ff; --work-soft:#1f3a63; --work-ink:#a6cdff; --brand:#3a8bff; --brand-ink:#1f66d1; --title:#a6cdff;
  --life:#58d6ac; --life-soft:#1f4a3e; --life-ink:#7fe6c3;
  --study:#b29cff; --study-soft:#352a63; --study-ink:#cfc2ff;
  --habit:#ffb366; --habit-soft:#4a3520; --habit-ink:#ffc68a;
  --pink:#ff9fbe; --buddy:#ffd76e; --buddy-ink:#2a2540; --leaf:#6fdc9f; --leaf-2:#45b67f; --bark:#c98f58; --soil:#4b4361; --water:#6cbcff;
  --danger:#ff8592; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"],:root:not([data-theme])[data-tod="night"]{
  --bg:#0f1a2e; --bg-2:#14223b; --surface:#1a2a47; --surface-2:#223558; --line:#2c4269;
  --fg:#eaf2ff; --muted:#a3b7d8; --faint:#6a82aa;
  --work:#6fb0ff; --work-soft:#1f3a63; --work-ink:#a6cdff; --brand:#3a8bff; --brand-ink:#1f66d1; --title:#a6cdff;
  --life:#58d6ac; --life-soft:#1f4a3e; --life-ink:#7fe6c3;
  --study:#b29cff; --study-soft:#352a63; --study-ink:#cfc2ff;
  --habit:#ffb366; --habit-soft:#4a3520; --habit-ink:#ffc68a;
  --pink:#ff9fbe; --buddy:#ffd76e; --buddy-ink:#2a2540; --leaf:#6fdc9f; --leaf-2:#45b67f; --bark:#c98f58; --soil:#4b4361; --water:#6cbcff;
  --danger:#ff8592; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.moonrow{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-radius:14px;background:color-mix(in srgb,#e8789a 16%,var(--surface));color:color-mix(in srgb,#b4416a 80%,var(--fg));font-size:13.5px;margin:2px 0 10px}.moonrow>svg{flex:none}.moonrow span{flex:1;min-width:0}.moonrow.on{width:100%;border:none;font:inherit;text-align:left;cursor:pointer}.moonrow .mchev{font-style:normal;font-size:18px;opacity:.6}.moon-sheet h3{display:flex;align-items:center;gap:8px}.moon-acts{display:flex;flex-direction:column;gap:8px}.moon-sheet .btn.primary.moon-go{background:#e8789a;border-color:#e8789a;box-shadow:0 3px 0 #c4577a}
.moonrow.off{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.moonrow .mb{border:none;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;background:var(--surface);color:inherit;cursor:pointer;white-space:nowrap}.moonrow.off .mb{background:var(--surface-2);color:var(--fg)}.moonrow .mb.ghost{background:none;color:var(--muted);padding:5px 4px}
.cal-day.moon .cal-top b{background:color-mix(in srgb,#e8789a 24%,var(--surface));color:color-mix(in srgb,#b4416a 85%,var(--fg));border-radius:999px;padding:0 5px}.cal-day.today.moon .cal-top b{background:var(--brand);color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,#e8789a 35%,var(--surface))}.cal-legend .lgmoon{display:inline-block;width:16px;height:11px;border-radius:99px;background:color-mix(in srgb,#e8789a 24%,var(--surface));vertical-align:-1px;margin-right:3px}
.gear{border:none;background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:16px;box-shadow:0 3px 0 var(--line);padding:0}
@media(max-width:600px){.title-row{align-items:center;row-gap:8px;column-gap:8px}.title-row h1{flex-basis:100%}.title-row .today,.title-row .wx{align-self:center}.hd-acts{gap:6px}.hd-acts .gear{width:32px;height:32px;font-size:15px}.title-row .jbtn{height:32px;padding:0 10px}}
#jbtnTxt{display:none}.title-row .hd-acts .jbtn{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%;font-size:16px;border:none;box-shadow:0 3px 0 var(--line)}
@media(max-width:600px){.title-row .hd-acts .jbtn{width:32px;height:32px;padding:0;font-size:15px}}
.hd-acts{margin-left:auto;align-self:center;display:flex;align-items:center;gap:8px}.hd-acts>button{margin:0;flex:none}.hd-acts .gear{display:grid;place-items:center;line-height:1}.hd-acts .gear[hidden]{display:none}
.gear#gear{position:relative}.gear#gear.synced::after{content:"";position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--water) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 12 12%27%3E%3Cpath d=%27M3.2 6.2l1.8 1.8 3.8-3.8%27 stroke=%27white%27 stroke-width=%271.8%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/100% no-repeat;box-shadow:0 0 0 2px var(--surface)}
.synccard .sc-body{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:10px 12px}.synccard .sc-body>svg{width:26px;height:26px;flex:none}.synccard .sc-body>div{display:flex;flex-direction:column;gap:8px;min-width:0}.synccard .cap-row{margin:0}
.gear.sync{display:grid;place-items:center}.gear.sync svg{width:22px;height:22px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;background:var(--surface);font-weight:600}
.au-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}.au-or::before,.au-or::after{content:"";flex:1;height:2px;background:var(--line)}
.au-err{margin:0;color:var(--danger);font-size:13.5px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 10% 6%,var(--bg-2) 0 130px,transparent 131px),radial-gradient(circle at 90% 18%,var(--bg-2) 0 90px,transparent 91px),radial-gradient(circle at 80% 70%,var(--bg-2) 0 110px,transparent 111px);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* garden with the growing buddy */
.garden{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:24px;padding:10px 16px 10px 8px;box-shadow:var(--shadow)}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;line-height:1.1;color:var(--title)}
.today{font-family:var(--f-num);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.buddy{width:104px;height:104px;flex:none;cursor:pointer;position:relative}
.buddy svg{width:100%;height:100%;overflow:visible}
.g-text{min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage b{font-family:var(--f-display);font-weight:400;font-size:18px}
.stage .lv{font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--leaf-2);background:color-mix(in srgb,var(--leaf) 20%,transparent);border-radius:999px;padding:1px 9px}
.bubble{position:relative;background:var(--bg-2);border-radius:14px;padding:6px 12px;font-size:13.5px;width:fit-content;max-width:100%}
.bubble::before{content:"";position:absolute;left:-6px;top:13px;width:12px;height:12px;background:var(--bg-2);transform:rotate(45deg);border-radius:3px}
.bubble span{position:relative}
.meter{display:flex;flex-direction:column;gap:5px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meter-top .w{font-family:var(--f-num);font-weight:600;color:var(--water);font-variant-numeric:tabular-nums}
.wbar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--water),var(--leaf));transition:width .6s}
.status{font-size:13px;color:var(--danger)}
.plus{position:absolute;font-family:var(--f-num);font-weight:600;color:var(--water);font-size:18px;pointer-events:none;z-index:3}
.drop{position:fixed;font-size:20px;pointer-events:none;z-index:31;left:0;top:0}
/* capture: floating button + bottom sheet */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:50%;width:72px;height:72px;padding:0;background:var(--brand);box-shadow:0 5px 0 var(--brand-ink),0 10px 24px rgba(30,80,160,.25);display:grid;place-items:center;transition:transform .15s}
.fab svg{width:60px;height:60px;overflow:visible;margin-top:2px}
.fab:hover{transform:translateY(-2px) rotate(-6deg)}
.fab .tw{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.fab .tw{animation:tw 1.8s ease-in-out infinite}.fab .tw2{animation-delay:.6s}.fab .tw3{animation-delay:1.1s}}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brand-ink)}
.cap-wrap{position:fixed;inset:0;z-index:25;background:rgba(20,35,70,.38);display:flex;align-items:flex-end;justify-content:center}
.cap-wrap .capture{width:100%;max-width:580px;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.cap-wrap{align-items:center}.cap-wrap .capture{border-radius:26px}}
.cap-head .x{margin-left:auto;border:none;background:var(--surface-2);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--muted);line-height:1}
@media (prefers-reduced-motion:no-preference){.cap-wrap:not([hidden]) .capture{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* capture */
.capture{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.cap-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:18px}
.cap-head .pen{width:26px;height:26px}
.capture textarea{width:100%;min-height:68px;resize:vertical;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);padding:11px 14px;line-height:1.55}
.capture textarea:focus{border-color:var(--brand);outline:none}
.cap-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 0 var(--brand-ink)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.hint{font-size:12.5px;color:var(--muted)}
.preview{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.pv{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--bg-2)}
.pv input[type=checkbox]{margin-top:5px;accent-color:var(--work);width:16px;height:16px}
.pv-body{min-width:0;display:flex;flex-direction:column;gap:7px}
.pv-title{border:none;background:transparent;padding:0;width:100%;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border:2px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--muted)}
.chip.on.work{background:var(--work-soft);color:var(--work-ink);border-color:var(--work)}
.chip.on.study{background:var(--study-soft);color:var(--study-ink);border-color:var(--study)}
.chip.on.life{background:var(--life-soft);color:var(--life-ink);border-color:var(--life)}
.chip.on.hz{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gap{width:4px}

/* tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:8px 6px;font-weight:500;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center;transition:transform .15s}
.tab svg{width:22px;height:22px;flex:none}
.tab .tl{white-space:nowrap}
.tab .n{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;padding:0 8px;border-radius:999px;background:var(--surface-2)}
.tab[aria-selected=true]{color:var(--fg);transform:translateY(-2px)}
.tab[data-k=work][aria-selected=true]{border-color:var(--work);background:var(--work-soft);box-shadow:0 4px 0 var(--work)}
.tab[data-k=study][aria-selected=true]{border-color:var(--study);background:var(--study-soft);box-shadow:0 4px 0 var(--study)}
.tab[data-k=life][aria-selected=true]{border-color:var(--life);background:var(--life-soft);box-shadow:0 4px 0 var(--life)}
.tab[data-k=habit][aria-selected=true]{border-color:var(--habit);background:var(--habit-soft);box-shadow:0 4px 0 var(--habit)}
.tab[aria-selected=true] .n{background:var(--surface)}

/* Overview */
.board.ov{gap:12px}
.ov-today{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ov-th{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.ov-th b{font-size:18px}.ov-th small{color:var(--muted);font-size:13px}.ov-th em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--muted)}
.ov-sub{margin:4px 2px 0;font-size:12px;color:var(--faint);letter-spacing:.04em}
.ov-it{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;background:var(--surface-2);min-width:0}.ov-it>*:not(.ov-t){flex:none}
.ov-it.first{box-shadow:0 0 0 2px var(--brand);background:var(--surface)}
.ov-ck{width:22px;height:22px;border-radius:50%;border:2.4px solid var(--c);background:none;flex:none;cursor:pointer;padding:0}.ov-ck:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.ov-t{flex:1 1 auto;min-width:0;text-align:left;border:none;background:none;color:var(--fg);font:inherit;font-size:14.5px;font-weight:500;padding:0;cursor:pointer;overflow-wrap:anywhere}
.ov-pri{color:var(--danger);font-weight:800;font-size:14px}
.ov-tag{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--surface);color:var(--muted);white-space:nowrap}.ov-tag.go{background:var(--brand);color:#fff}
.ov-it .due.odbtn{font-size:11.5px;padding:2px 8px}
.ov-mv{border:none;background:none;color:var(--brand);font:inherit;font-size:12.5px;padding:2px 4px;cursor:pointer;white-space:nowrap}
.ov-play{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface);color:var(--brand);font-size:10px;cursor:pointer;flex:none}
@media(max-width:460px){.ov-tag.go{display:none}.ov-it{gap:6px}}
.ov-hab{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-bottom:4px}.ov-hl{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-right:2px}.ov-hl svg{width:16px;height:16px}
.ov-hc{border:none;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;background:var(--surface-2);color:var(--fg);cursor:pointer;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--habit) 45%,transparent)}.ov-hc.on{background:color-mix(in srgb,var(--habit) 22%,var(--surface));color:color-mix(in srgb,var(--habit) 60%,var(--fg));box-shadow:none}
.ov-it.ovstep .ov-ck{border-style:dashed}.ov-t small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ov-tag.late{color:var(--danger)}
.ov-chip.ovstep{background:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}.ov-chip em{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:9em}
.sday{border:none;border-radius:999px;padding:2px 9px;font:inherit;font-size:11.5px;background:var(--surface-2);color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}.sday.set{background:color-mix(in srgb,var(--brand) 15%,var(--surface));color:var(--brand)}
.ov-loose{border:1.5px dashed var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}.ov-lc{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}.ov-loose .ov-dh small{font-size:12px}
.ov-lr{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:8px 10px}.ov-lr>*:not(.ov-t){flex:none}.ov-lr .ov-ck{width:20px;height:20px}
.ov-put{border:none;border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand);cursor:pointer;white-space:nowrap}
.ov-ask{display:flex;align-items:center;gap:10px;border:1.5px dashed color-mix(in srgb,var(--brand) 45%,var(--line));background:none;border-radius:14px;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--brand);cursor:pointer;text-align:left}.ov-ask>svg{width:30px;height:30px;flex:none}
.ov-tag.carry{color:#c98320;background:color-mix(in srgb,#f0b43a 16%,var(--surface))}.due.plan{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.pv-today{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.slbtn{display:flex;width:fit-content;margin:7px 0 0;border:none;border-radius:999px;padding:3px 11px;font:inherit;font-size:12.5px;font-weight:600;background:#5b5fc7;color:#fff;cursor:pointer;vertical-align:middle;white-space:nowrap}.slbtn[data-sl=wake]{background:#f0a63a}.slbtn[hidden]{display:none}
#stageName{white-space:nowrap}
@media(max-width:380px){.garden .stage{flex-wrap:wrap;row-gap:4px}.stage b{font-size:16px}.stage .forest-btn,.stage .coin-btn{font-size:12.5px}.g-text{min-width:0}}

.slq3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slq3 button{border:none;border-radius:16px;padding:8px 4px 6px;font:inherit;font-size:12.5px;background:var(--surface-2);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.slq3 button svg{width:40px;height:40px}.slq3 button.on{color:var(--fg);box-shadow:inset 0 0 0 2px #8f88ff;background:color-mix(in srgb,#8f88ff 14%,var(--surface))}

.ov-dhb{border:none;background:none;padding:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}.ov-ar{color:var(--faint);font-size:18px;line-height:1;transition:transform .2s}.ov-day.open .ov-ar{transform:rotate(90deg)}

.ov-pk{display:flex;flex-direction:column;gap:6px}.ov-pki{display:flex;align-items:center;gap:8px;border:none;background:var(--surface-2);border-radius:12px;padding:9px 10px;font:inherit;font-size:14px;color:var(--fg);text-align:left;cursor:pointer}.ov-pki i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}.ov-pki span{flex:1;min-width:0}.ov-pki small{color:var(--muted);font-size:11.5px}.ov-pki em{font-style:normal;font-size:12.5px;color:var(--brand);white-space:nowrap}
.ov-dh{display:flex;align-items:center;gap:8px}.ov-dh b{font-size:14px}.ov-dh small{color:var(--muted);font-size:12.5px}

.ov-dl{display:flex;flex-wrap:wrap;gap:6px}

.ov-empty{margin:0;font-size:12.5px;color:var(--faint)}
.ov-later{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
.tab[data-k=ov]{padding-inline:12px}.tab[data-k=ov] .tl{display:none}.tab[data-k=ov][aria-selected=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));box-shadow:0 4px 0 var(--brand)}
/* 四象限 */
.tab[data-k=ov] .n{background:color-mix(in srgb,var(--danger) 18%,var(--surface-2));color:var(--danger)}.tab[data-k=ov] .n:empty,.tab[data-k=ov] .n.zero{display:none}
.tab[data-k=quad][aria-selected=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));box-shadow:0 4px 0 var(--brand)}
.qicon{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px;flex:none}.qicon i{border-radius:2.5px;background:var(--faint)}.qicon i:first-child{background:var(--danger)}.qicon i:nth-child(2){background:var(--brand)}
.board.quad{gap:12px}
.qtop{display:flex;flex-direction:column;gap:6px}.qhow{margin:0;font-size:12px;color:var(--faint);line-height:1.5}
.qchips{display:flex;gap:6px;flex-wrap:wrap}.qchip{border:none;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line);cursor:pointer;display:inline-flex;align-items:center;gap:6px}.qchip i{width:8px;height:8px;border-radius:50%}.qchip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.qgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:clamp(300px,44vh,500px);gap:12px}
.qgrid .qbox{overflow:hidden}.qgrid .qbox .list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 8px;margin:-2px -2px 0;scrollbar-width:thin}.qgrid .qnone{flex:1;display:grid;place-items:center}.qgrid .qbox .list>*{flex-shrink:0}
@media(max-width:760px){.qgrid{grid-template-columns:1fr;grid-auto-rows:auto}.qgrid .qbox .list{overflow:visible}.qbox.qempty:not(.q1){display:none}}

.qbox.q1{--qc:var(--danger)}.qbox.q2{--qc:var(--brand)}.qbox.q3{--qc:#d08a1e}.qbox.q4{--qc:#8a9bb8}
.qbox.qu{background:none;border:1.5px dashed var(--line)}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.qh b{font-size:15px;color:var(--qc)}.qbox.q3 .qh b{color:color-mix(in srgb,#d08a1e 75%,var(--fg))}.qh small{font-size:12px;color:var(--muted)}.qh em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--qc);background:var(--surface);border-radius:999px;padding:1px 9px}
.qbox .list{display:flex;flex-direction:column;gap:8px}.qnone{margin:0;font-size:12.5px;color:var(--faint);text-align:center;padding:6px}
.qmore{align-self:center;font-size:13px}
.qurow{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:8px 8px 8px 12px}.qdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.qut{flex:1;min-width:0;text-align:left;border:none;background:none;font:inherit;font-size:14px;color:var(--fg);padding:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{border:none;border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap}
.qrow{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.qrow .task.task{border-left-color:var(--c);row-gap:6px;box-shadow:none;background:none;border-radius:18px 18px 0 0}.qrow .task:last-child{border-radius:18px}.qrow .subwrap{margin:-6px 12px 10px 52px}.qrow:has(.task.p3){box-shadow:inset 3px 0 0 #ef5d6e,var(--shadow)}.qrow .task>.tagset{grid-column:2/-1;grid-row:2;justify-self:start;justify-content:flex-start}.qrow .task>.tagset:empty{display:none}
/* boards */
.board{display:flex;flex-direction:column;gap:20px;--c:var(--work);--soft:var(--work-soft);--ink:var(--work-ink)}
.board[data-k=study]{--c:var(--study);--soft:var(--study-soft);--ink:var(--study-ink)}
.board[data-k=life]{--c:var(--life);--soft:var(--life-soft);--ink:var(--life-ink)}
.board[data-k=habit]{--c:var(--habit);--soft:var(--habit-soft);--ink:var(--habit-ink)}
.group h2{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 8px;color:var(--fg)}
.group h2 .badge{width:10px;height:10px;border-radius:50%;background:var(--c)}
.group h2 .sub{font-family:var(--f-body);font-size:12.5px;color:var(--muted)}
.group h2 .add{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:var(--surface);color:var(--c);display:grid;place-items:center;padding:0;flex:none;transition:transform .15s,background .15s}
.group h2 .add:hover{background:var(--c);color:#fff;transform:rotate(90deg)}
.group h2 .add svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.group h2 .cnt{margin-left:auto;font-family:var(--f-num);font-size:14px;color:var(--ink);background:var(--soft);border-radius:999px;padding:0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:2px dashed var(--line);color:var(--muted);font-size:13.5px}
.empty svg{width:44px;height:44px;flex:none}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);transition:transform .15s}
.task:hover{transform:translateY(-1px)}
.check{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;transition:transform .15s}
.check:hover{transform:scale(1.1)}
.check.on{background:var(--c)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on svg{opacity:1}
.t-main{min-width:0;border:none;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.t-title{overflow-wrap:anywhere;font-weight:500}
.task.done{box-shadow:none;background:var(--surface-2)}
.task.done .t-title{color:var(--faint);text-decoration:line-through;font-weight:400}
.t-note{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.due.over{background:var(--danger);color:#fff}
.due.soon{background:var(--habit-soft);color:var(--habit-ink)}
details.done-box summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 2px;list-style:none}
details.done-box summary::before{content:"▸ ";}
details.done-box[open] summary::before{content:"▾ ";}
details.done-box .list{margin-top:8px}

/* life sub-sections */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.seg button{border:none;background:transparent;border-radius:14px;padding:8px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button .n{font-family:var(--f-num);font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 7px}
.seg button[aria-pressed=true]{background:var(--life-soft);color:var(--life-ink)}
.seg button[aria-pressed=true] .n{background:var(--surface)}
.card{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.card-head .sub{font-size:12.5px;color:var(--muted)}
.card-head .right{margin-left:auto;display:flex;gap:6px}
.link{border:none;background:none;color:var(--life-ink);font-size:13px;padding:2px 4px}
.staples{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}.staples .st{white-space:nowrap}
.st{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;transition:transform .12s}
.st:hover{transform:translateY(-1px)}
.st.pick{background:var(--life);border-color:var(--life);color:#fff}
.st.inlist{border-style:dashed;color:var(--faint)}
.st .x{font-size:13px;color:var(--danger);font-weight:700}
.shop-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shop-add input[type=text]{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;background:var(--bg-2);padding:8px 16px}
.shop-add input[type=text]:focus{border-color:var(--life);outline:none}
.shop-add label{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
.shop-add input[type=checkbox]{accent-color:var(--life)}
.btn.life{background:var(--life);border-color:var(--life);color:#fff;box-shadow:0 3px 0 var(--life-ink)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:2px dotted var(--line)}
.item:first-child{border-top:none}
.item .nm{overflow-wrap:anywhere;min-width:0}
.item.got .nm{color:var(--faint);text-decoration:line-through}
.item .star{border:none;background:none;padding:2px;font-size:16px;color:var(--faint);line-height:1}
.item .star.on{color:var(--habit)}
.item .del{border:none;background:none;color:var(--faint);font-size:18px;padding:0 4px;line-height:1}
.item .del:hover{color:var(--danger)}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* daily summary */
.mood{gap:5px!important;padding:3px 11px 3px 6px!important}
.mood .mface{width:28px;height:28px;flex:none;margin-block:-3px}
.cal-mood .mface{width:17px;height:17px;display:block}
.cal{background:var(--surface);border-radius:22px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.cal-head button{border:none;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:17px;color:var(--muted)}
.cal-head button:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:2px}
.cal-day{min-height:60px;border:2px solid transparent;background:var(--bg-2);border-radius:12px;padding:3px 3px 4px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;transition:transform .12s}
.cal-day:hover:not(:disabled){transform:translateY(-1px)}
.cal-day:disabled{opacity:.35;cursor:default}
.cal-day.sel{border-color:var(--brand);background:var(--surface-2)}
.cal-top{display:flex;justify-content:space-between;align-items:center;gap:2px;min-height:16px}
.cal-top b{font-family:var(--f-num);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;padding-left:2px}
.cal-day.today .cal-top b{color:#fff;background:var(--brand);border-radius:999px;padding:0 5px}
.cal-note{font-size:11px;color:var(--brand)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pill{font-style:normal;font-family:var(--f-num);font-weight:600;font-size:10px;line-height:15px;text-align:center;border-radius:6px;background:var(--s);color:var(--c);font-variant-numeric:tabular-nums}
.cal-day{position:relative}
.cal-day.ms{background:color-mix(in srgb,#ffd34d 32%,var(--bg-2));border-color:#ffd34d}
.cal-day.ms.sel{border-color:var(--brand)}
.cal-ms{position:absolute;right:-5px;top:-7px;width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.cal-ms .msface{width:100%;height:100%;display:block}
.cal-legend .msface{width:14px;height:14px}
.ms-card{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.ms-card.has{background:linear-gradient(135deg,color-mix(in srgb,#ffd34d 24%,var(--surface)),var(--surface) 65%)}
.ms-card .card-head .msface{width:30px;height:30px}
.ms-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ms-list li{display:flex;align-items:center;gap:8px;background:#fff3c4;color:#5a4400;border-radius:14px;padding:8px 10px 8px 14px;font-weight:600}
.ms-list .ms-t{flex:1;min-width:0;overflow-wrap:anywhere}
.ms-list .del{border:none;background:none;color:#a07a00;font-size:18px;padding:0 4px;line-height:1}
.ms-add{display:flex;gap:8px}
.ms-add input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;background:var(--bg-2);padding:8px 16px}
.ms-add input:focus{border-color:#f2a20c;outline:none}
.ms-btn{background:#ffd34d;border-color:#ffd34d;color:#5a4400;box-shadow:0 3px 0 #e0a800}
.ms-wall{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.ms-wall-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.ms-wall-head b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--fg)}
.ms-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;border:none;background:var(--bg-2);border-radius:12px;padding:6px 10px 6px 6px;text-align:left}
.ms-row:hover{background:var(--surface-2)}
.ms-row .msface{width:26px;height:26px}
.ms-row-t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-row-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmode button{display:flex;align-items:center;gap:4px}
.fmode svg{width:18px;height:18px;flex:none}
.rc-btns{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px dashed var(--line);padding-bottom:12px}
@media(max-width:600px){.rc-btns{gap:6px}.rc-btns .btn{flex:1 1 auto;min-width:0;padding:7px 6px;font-size:13px;white-space:nowrap;text-align:center}}
@media(max-width:380px){.rc-btns .btn{font-size:12px;padding:7px 4px}}
.rc-btns .btn{font-size:13px;padding:5px 12px}
/* recap sheet: a keepsake page */
.sheet.rc-sheet{padding:0;gap:0;max-width:600px;overflow:auto}
.sheet.rc-sheet>*{flex-shrink:0}
.rc-hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:24px 20px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--water) 42%,var(--surface)) 0%,color-mix(in srgb,var(--leaf) 34%,var(--surface)) 100%);overflow:hidden}
.rc-spark{position:absolute;inset:0;width:100%;height:100%;fill:var(--surface);opacity:.7;pointer-events:none}
.rc-titles{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.rc-eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--fg);opacity:.65}
.rc-titles h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;text-wrap:balance}
.rc-range{width:fit-content;background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;font-family:var(--f-num);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.rc-pet{position:relative;width:96px;height:96px;margin-right:14px}
.rc-pet .mface{width:100%;height:100%}
.rc-hero .x{position:absolute;top:10px;right:10px;border:none;background:var(--surface);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--muted);line-height:1}
.rc-body{padding:18px 20px 8px;display:flex;flex-direction:column;gap:20px}
.rc-sum{display:flex;flex-direction:column;gap:8px}
.rc-big{display:flex;align-items:baseline;gap:6px}
.rc-big .drop{font-size:26px;align-self:center}
.rc-big b{font-family:var(--f-num);font-weight:600;font-size:46px;line-height:1;color:var(--water);font-variant-numeric:tabular-nums}

.jstat b{display:block;font-family:var(--f-num);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.jstat span{font-size:12px;color:var(--muted)}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jbox{background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.jbox h4{margin:0;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:400;font-size:17px}
.jbox h4 i{width:10px;height:10px;border-radius:50%;flex:none}
.jbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.jbox li{display:flex;gap:6px;align-items:baseline;overflow-wrap:anywhere}
.jbox li::before{content:"✓";font-weight:700;color:var(--c,var(--muted))}
.jbox .none{font-size:13px;color:var(--faint)}
.comment{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.comment .mini{width:64px;height:64px}
.comment .mini svg{width:100%;height:100%;overflow:visible}
.comment .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.comment h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.comment p{margin:0;line-height:1.75;white-space:pre-wrap}
.comment .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reflect{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.reflect h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px;display:flex;gap:4px;align-items:center}
.mood.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.reflect textarea{width:100%;min-height:96px;resize:vertical;border:2px solid var(--line);border-radius:16px;background:var(--bg-2);padding:10px 14px;line-height:1.6}
.reflect textarea:focus{border-color:var(--brand);outline:none}
.saved{font-size:12px;color:var(--muted)}
@media(max-width:520px){.jgrid{grid-template-columns:1fr}.jstats{grid-template-columns:repeat(2,1fr)}}

/* forest */
.forest-btn{margin-left:auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:500;display:flex;gap:4px;align-items:center;white-space:nowrap}

.forest-btn[aria-pressed=true]{border-color:var(--leaf-2);background:color-mix(in srgb,var(--leaf) 18%,transparent)}
#plantBtn{width:fit-content;padding:5px 14px}
.dz-bob{animation:dzBob 2.4s ease-in-out infinite}@keyframes dzBob{50%{transform:translateY(-3px)}}
.dz-tw{animation:dzTw 1.6s ease-in-out infinite}@keyframes dzTw{50%{opacity:.2}}

{const navZh=()=>{try{return [...(navigator.languages||[]),navigator.language||""].some(x=>String(x).toLowerCase().startsWith("zh"))}catch(_){return false}};

        <button class="h-del" data-act="hdel" data-id="${h.id}">${L("移除","Remove")}</button>
      </div>

  return `<div class="board" data-k="habit">
    <div class="hday" role="group" aria-label="${L("选择打卡日期","Pick a day to check in")}">

      <span class="hd-name"><b>${dayName}</b> ${L(`${dm}月${dd}日`,`${dd} ${MON[dm-1]}`)}</span>
      <button data-act="hday" data-v="1" ${past?"":"disabled"} aria-label="${L("后一天","Next day")}">›</button>

    </div>
    ${past?`<p class="hd-note">${L(`正在给 ${dm}月${dd}日补打卡。补的打卡一样算进连续天数，也会给{pet}浇水。`,`Checking in for ${dd} ${MON[dm-1]}. Late check-ins still count toward your streak and water {pet}.`)}</p>`:""}
    <div class="list">${!loaded.h?emptyBox(L("正在读取打卡项…","Loading check-ins…")):rows||emptyBox(L('还没有打卡项。加一个每天想坚持的小习惯，比如"背 30 个单词"。','No check-ins yet. Add a small daily habit, like "30 minutes of reading".'))}</div>
    <form class="habit-add" id="habitForm"><input id="habitName" placeholder="${L("新的每日小习惯","New daily habit")}" maxlength="40" aria-label="${L("新的每日小习惯","New daily habit")}"><button class="btn" type="submit">${L("添加","Add")}</button></form>

  </div>`;
}

const SHOP_RE=/(买|购买|采购|补货|囤|入手|补一下|补点)|\b(buy|grab|pick up|purchase|restock|shop for)\b/i;
const isAscii=w=>/^[\x00-\x7f]+$/.test(w);
const escRe=w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const hit=(t,w)=>w instanceof RegExp?w.test(t):isAscii(w)?new RegExp("\\b"+escRe(w)+"s?\\b","i").test(t):t.includes(w);
const has=(t,list)=>list.reduce((n,w)=>n+(hit(t,w)?1:0),0);
const WDMAP={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0,"末":6};
const ENWD={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6,sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const ENMON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
const CN={"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
const toNum=s=>/^\d+$/.test(s)?+s:(s.length===2&&s[0]==="十"?10+CN[s[1]]:s.length===2&&s[1]==="十"?CN[s[0]]*10:s.length===3?CN[s[0]]*10+CN[s[2]]:CN[s]);
const ENNUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,a:1};

// returns {due, rest} where rest is the text with the date phrase removed
function pickDate(text,today,dayFirst){
  const [Y,M,D]=today.split("-").map(Number); const base=new Date(Y,M-1,D);
  const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const plus=n=>{const d=new Date(base);d.setDate(d.getDate()+n);return fmt(d)};
  const md=(mm,dd)=>{let d=new Date(Y,mm-1,dd);if(d<base)d=new Date(Y+1,mm-1,dd);return fmt(d)};
  const toWeekday=(w,mode)=>{const mon=(base.getDay()+6)%7, target=(w+6)%7; let diff=target-mon;
    if(mode==="nn")diff+=14; else if(mode==="next")diff+=7; else if(mode!=="this"&&diff<0)diff+=7; else if(mode==="this"&&diff<0)diff+=7; return plus(diff)};
  const tail="(?:之前|以前|前|之内|以内|内|左右)?";
  const pre="(?:\\b(?:by|before|on|at|due|until|for)\\s+)?";
  const wdNames=Object.keys(ENWD).sort((a,b)=>b.length-a.length).join("|");
  const monNames=Object.keys(ENMON).sort((a,b)=>b.length-a.length).join("|");
  const tries=[
    // Chinese
    [new RegExp("(今天|今晚|今早|今日)"+tail),()=>plus(0)],
    [new RegExp("大后天"+tail),()=>plus(3)],
    [new RegExp("后天"+tail),()=>plus(2)],
    [new RegExp("(明天|明早|明晚|明日)"+tail),()=>plus(1)],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*(?:天|日)(?:后|之后|内|以内)"),m=>plus(toNum(m[1]))],
    [new RegExp("(下下|下个?|这个?|本)?(?:周|星期|礼拜)([一二三四五六日天末])"+tail),m=>toWeekday(WDMAP[m[2]],m[1]?(m[1].startsWith("下下")?"nn":m[1].startsWith("下")?"next":"this"):"")],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*月\\s*(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*[日号]?"+tail),m=>md(toNum(m[1]),toNum(m[2]))],
    [new RegExp("(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*号"+tail),m=>{const dd=toNum(m[1]);let d=new Date(Y,M-1,dd);if(d<base)d=new Date(Y,M,dd);return fmt(d)}],
    [new RegExp("月底"+tail),()=>fmt(new Date(Y,M,0))],
    [new RegExp("(这周|本周)"+tail),()=>plus((7-base.getDay())%7)],
    [new RegExp("下周"+tail),()=>plus(((7-base.getDay())%7)+7)],
    // English
    [new RegExp(pre+"\\b(?:the\\s+)?day after tomorrow\\b","i"),()=>plus(2)],
    [new RegExp(pre+"\\b(?:today|tonight|this (?:morning|afternoon|evening))\\b","i"),()=>plus(0)],
    [new RegExp(pre+"\\b(?:tomorrow|tmr|tmrw)\\b(?:\\s+(?:morning|afternoon|evening|night))?","i"),()=>plus(1)],
    [new RegExp("\\b(?:in|within)\\s+(\\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|a)\\s+days?\\b","i"),m=>plus(/\d/.test(m[1])?+m[1]:ENNUM[m[1].toLowerCase()])],
    [new RegExp("\\b(?:in|within)\\s+(\\d|one|two|three|a)\\s+weeks?\\b","i"),m=>plus(7*(/\d/.test(m[1])?+m[1]:ENNUM[m[1].toLowerCase()]))],
    [new RegExp(pre+"\\b(this|next)?\\s*weekend\\b","i"),m=>toWeekday(6,m[1]&&m[1].toLowerCase()==="next"?"next":"")],
    [new RegExp(pre+"\\b(this|next|coming)?\\s*("+wdNames+")\\b","i"),m=>toWeekday(ENWD[m[2].toLowerCase()],m[1]&&m[1].toLowerCase()==="next"?"next":m[1]&&m[1].toLowerCase()==="this"?"this":"")],
    [new RegExp(pre+"\\b("+monNames+")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b","i"),m=>md(ENMON[m[1].toLowerCase()],+m[2])],
    [new RegExp(pre+"\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?("+monNames+")\\b","i"),m=>md(ENMON[m[2].toLowerCase()],+m[1])],
    [new RegExp(pre+"\\b(\\d{1,2})[/.](\\d{1,2})\\b"+tail),m=>dayFirst?md(+m[2],+m[1]):md(+m[1],+m[2])],
    [new RegExp(pre+"\\b(?:the\\s+)?end of (?:the\\s+)?month\\b|\\beom\\b","i"),()=>fmt(new Date(Y,M,0))],
    [new RegExp(pre+"\\b(?:the\\s+)?end of (?:the\\s+)?week\\b|\\bthis week\\b","i"),()=>plus((7-base.getDay())%7)],
    [new RegExp(pre+"\\bnext week\\b","i"),()=>plus(((7-base.getDay())%7)+7)],
  ];
  for(const [re,fn] of tries){const m=text.match(re);if(m){const due=fn(m);if(due&&!/NaN|undefined/.test(due))return {due,rest:text.replace(m[0]," ")}}}
  return {due:null,rest:text};
}
function cleanTitle(t){
  t=t.replace(/^\s*(?:今年|明年|这个月|本月|下个月|最近|近期|这周|本周|以后|将来)/,"")
     .replace(/^[\s，,。、:：;；]*(?:我|今天|还)?(?:要|得|需要|记得|别忘了|别忘记|想|打算|准备|计划|必须|一定要)+/,"")
     .replace(/^(?:去|把)?\s*/,m=>m.trim()==="把"?"":m);
  t=t.replace(/^\s*(?:and\s+|also\s+|then\s+)?(?:i\s+)?(?:really\s+)?(?:need to|have to|has to|must|should|gotta|got to|want to|wanna|plan to|planning to|remember to|don'?t forget to|try to|will|'ll|am going to|i'm going to|going to)\s+/i,"")
     .replace(/^\s*(?:to|i)\s+/i,"")
     .replace(/\s+(?:by|before|on|at|in|due|until|this|next|for)\s*$/i,"");
  t=t.replace(/[\s，,。、;；!！?？~～.]+$/,"").replace(/\s{2,}/g," ").trim();
  return /^[a-z]/.test(t)?t[0].toUpperCase()+t.slice(1):t;
}
function shopItems(part){
  return part.split(/[、，,&\/]|和|跟|与|及|以及|\band\b|\bplus\b/i)
    .map(x=>x.replace(/^\s*(?:一下|点|些|一些|个)/,"")
      .replace(/^(?:一|两|几)?(?:瓶|包|袋|盒|个|斤|打|箱|罐|卷|点|些)/,"")
      .replace(/^\s*(?:some|more|a few|a couple of|a|an|the|\d+x?|one|two|three|a bottle of|bottles of|a pack of|packs of|a bag of|bags of|a box of|boxes of|a dozen|a carton of|a loaf of|a tin of|cans? of)\s+/i,"")
      .replace(/\s+(?:from|at)\s+.*$/i,"")
      .replace(/[\s，,。!！~～.]+$/,"").trim())
    .filter(x=>x&&x.length<=30&&!/^(?:超市|东西|stuff|things|groceries|shopping|supermarket)$/i.test(x));
}
function ruleParse(text,today,fallback="life",dayFirst=false){
  const chunks=text.split(/[\n。；;！!？?]+|\.\s+|(?:还有|另外|然后|顺便|再就是)|\b(?:then|also|and then|plus also)\b/i).map(x=>x&&x.trim()).filter(Boolean);
  const out=[];
  const addTask=raw0=>{
    const pr0=pickRepeat(raw0,today), raw=pr0.rest;
    let {due,rest}=pr0.repeat?{due:null,rest:raw}:pickDate(raw,today,dayFirst);
    if(pr0.repeat&&!due)due=repFirst(normRepeat(pr0.repeat,today),today);
    const title=cleanTitle(rest); if(!title)return;
    const s=has(raw,RULES.study), w=has(raw,RULES.work);
    let space=s>w?"study":w>s?"work":s&&w?"study":fallback;
    let horizon="inbox";
    if(due){const diff=Math.round((new Date(due)-new Date(today))/864e5);horizon=diff<=7?"week":diff<=31?"month":"long"}
    else if(has(raw,RULES.week))horizon="week";
    else if(has(raw,RULES.month))horizon="month";
    else if(has(raw,RULES.long))horizon="long";
    const pri=/(紧急|很急|急！|急!|特别重要|非常重要|重要|马上|!!|！！|\burgent\b|\bimportant\b|\basap\b|\bcritical\b|\bpriority\b)/i.test(raw)?3:/(不急|不着急|有空再|随便|\bno rush\b|\bwhenever\b|\bsomeday\b|\blow priority\b)/i.test(raw)?1:0;
    if(pr0.repeat&&/房租|水电|账单|rent|bill/i.test(raw0)&&!s&&!w)space="life";
    out.push({repeat:pr0.repeat?normRepeat(pr0.repeat,due):null,title:title.replace(/^(?:紧急|重要)[:：\s]*/,"").replace(/\s*(?:!!|！！)\s*$/,"").replace(/^(?:urgent|important)[:\s]+/i,"").slice(0,200)||title.slice(0,200),space,horizon,due,note:"",pri,keep:true});
  };
  const isTaskish=x=>has(x,RULES.study)||has(x,RULES.work);
  for(const chunk of chunks){
    const sm=chunk.match(SHOP_RE);
    if(sm){
      // the items run from "buy" until a comma-part that looks like a separate task (study/work words or its own date)
      const segs=chunk.slice(sm.index+sm[0].length).split(/[，,]/), shopSegs=[];
      let i=0;
      for(;i<segs.length;i++){const sg=segs[i]; if(isTaskish(sg)||(i>0&&pickDate(sg,today,dayFirst).due))break; shopSegs.push(sg)}
      if(shopSegs.length){
        // everything before the buy-clause is ordinary tasks; the clause that holds "buy" is just the errand itself
        const parts=chunk.slice(0,sm.index).split(/[，,]/);
        const lead=parts.pop();
        parts.forEach(addTask);
        if(lead&&isTaskish(lead))addTask(lead);
        shopItems(pickDate(shopSegs.join(","),today,dayFirst).rest).forEach(name=>out.push({title:name,space:"shop",horizon:"week",due:null,note:"",keep:true}));
        segs.slice(i).forEach(addTask);
        continue;
      }
    }
    chunk.split(/[，,]\s*(?=\S)/).forEach(addTask);
  }
  return out;
}

const newsPending=()=>NEWS().filter(n=>!tourSeen("nf:"+n.id));
let tourOn=null;
function tourGo(go){
  if(mbOpen)closeMailbox();
  if(idOpen)closeIdeas();
  if(go==="habit"){if(tab!=="habit"){tab="habit";render()}return}
  if(go==="journal"){if(tab!=="journal"){tab="journal";render()}return}
  if(go==="ov"){if(tab!=="ov"){tab="ov";render()}return}
  if(go==="forest"){if(tab!=="forest"){tab="forest";forestMode="land";render()}return}
  if(go==="study"&&on("study")){if(tab!=="study"){tab="study";render()}}
  else if(go==="lifewish"&&on("life")&&on("wish")){if(tab!=="life"||lifeSub!=="wish"){tab="life";lifeSub="wish";render()}}
  else if(go==="lifeshop"&&on("life")&&on("shop")){if(tab!=="life"||lifeSub!=="shop"){tab="life";lifeSub="shop";render()}}
}
function tourVisible(s){if(s.go==="habit"||s.go==="journal")return true;if(s.go==="study"&&!on("study"))return false;if(s.go==="lifeshop"&&!(on("life")&&on("shop")))return false;if(s.go==="lifewish"&&!(on("life")&&on("wish")))return false;if(!s.go)return !!document.querySelector(s.sel);return true}
function startTour(kind){
  const news=kind==="news"?newsPending():[];
  const steps=(kind==="news"?news.flatMap(n=>n.steps):kind==="new"?TOUR_NEW():TOUR_FULL()).filter(x=>on("classes")||!/\.cls/.test(x.sel));
  const qs=s=>document.querySelector(s.sel)||(s.alt?document.querySelector(s.alt):null);
  const prevTab=tab, prevSub=lifeSub;
  document.querySelectorAll(".tour-ui").forEach(x=>x.remove());
  const block=document.createElement("div");block.className="tour-ui tour-block";
  const spot=document.createElement("div");spot.className="tour-ui tour-spot";
  const tip=document.createElement("div");tip.className="tour-ui tour";tip.setAttribute("role","dialog");tip.setAttribute("aria-live","polite");
  document.body.append(block,spot,tip);
  let i=-1;
  const end=()=>{tourOn=null;document.querySelectorAll(".tour-ui").forEach(x=>x.remove());window.removeEventListener("resize",place);window.removeEventListener("scroll",place,true);document.removeEventListener("keydown",key);
    tourMark(kind);if(kind==="full"){tourMark("new");NEWS().forEach(n=>tourMark("nf:"+n.id))}if(kind==="news")news.forEach(n=>tourMark("nf:"+n.id));tab=prevTab;lifeSub=prevSub;render()};
  const key=e=>{if(e.key==="Escape")end();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
  function place(){const s=steps[i];if(!s)return;const el=qs(s);if(!el)return;
    const pad=s.pad??6, r=el.getBoundingClientRect();
    Object.assign(spot.style,{left:r.left-pad+"px",top:r.top-pad+"px",width:r.width+pad*2+"px",height:r.height+pad*2+"px",borderRadius:(r.height<70?999:18)+"px"});
    const w=tip.offsetWidth,h=tip.offsetHeight, below=r.bottom+pad+16+h<innerHeight||r.top-pad-16-h<0;
    tip.classList.toggle("dn",below);tip.classList.toggle("up",!below);
    const left=Math.min(Math.max(16,r.left+r.width/2-w/2),innerWidth-16-w);tip.style.left=left+"px";
    tip.style.top=Math.max(8,Math.min(innerHeight-h-8,below?r.bottom+pad+12:r.top-pad-12-h))+"px";
    tip.style.setProperty("--ax",Math.min(w-28,Math.max(12,r.left+r.width/2-left-9))+"px")}
  function go(d){
    let j=i+d; while(j>=0&&j<steps.length&&!tourVisible(steps[j]))j+=d;
    if(j>=steps.length){end();cheer(kind!=="full"?L("新功能就这些啦，慢慢玩～","That's what's new. Have fun～"):L("介绍完啦！先从打个卡开始吧～","That's the tour! Start with a check-in～"));return}
    if(j<0)return;
    i=j; const s=steps[i]; tourGo(s.go);
    requestAnimationFrame(()=>{const el=qs(s);if(!el){go(d||1);return}

const SEAL_KEY="lifeos-seal";

const sealSeed=id=>{let h=0;for(const ch of String(id||"x"))h=(h*31+ch.charCodeAt(0))%997;return 1+h%9};
function sealSVG(sl,size,seed){sl=sl&&W2[sl.c]?sl:{c:"red",e:"sprout"};return wax2({color:sl.c,emb:sl.e==="name"?null:sl.e,text:sl.e==="name"?((sl.t||"").trim()||"名"):null,wreath:!!sl.w,size,seed:seed||1})}

function peelOpen(sl,seed,cb){

async function openPip(){
  if(!pipOK()||!P)return;
  if(pipWin){pipWin.focus();return}
  pipBig=false;
  try{pipWin=await documentPictureInPicture.requestWindow({width:PIP_MINI[0],height:PIP_MINI[1]})}catch(_){pipWin=null;return}

  const st=d.createElement("style");st.textContent=PIP_CSS;d.head.appendChild(st);
  const lk=d.createElement("link");lk.rel="stylesheet";lk.href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap";d.head.appendChild(lk);

    const b=e.target.closest("[data-pp]");
    if(!b){if(!pipBig&&e.target.closest(".row,.mini"))pipSet(true);return}
    const a=b.dataset.pp;
    if(a==="close"){pipWin.close();return}
    if(a==="min"){pipSet(false);return}
    if(a==="pick"){startFocus(b.dataset.id);pipBig=false;drawPip(true);pipFit();return}
    if(!P)return;
    if(a==="pause"){if(P.pausedAt){P.pausedTotal+=Date.now()-P.pausedAt;P.pausedAt=null;if(P.phase==="focus")wakeOn()}else{P.pausedAt=Date.now();wakeOff()}saveP();renderPomo();drawPip(true);pipArm(4000);return}
    if(a==="stop"){if(P.phase==="focus"){const r=recordSession();if(r.tomato)water($("#buddy"),1);endPomo(r.mins>=1?L(`专注了 ${fmtHM(r.mins)}${r.tomato?"，+1 个番茄":""}`,`Focused ${fmtHM(r.mins)}${r.tomato?", +1 tomato":""}`):null)}else endPomo();return}
    if(a==="next"){toPick(false);pipBig=true;drawPip(true);setTimeout(pipFit,30);return}
    if(a==="sub"){const t=curTask(),i=+b.dataset.i;if(!t||!t.subs||!t.subs[i])return;const subs=t.subs.map(x=>({...x}));subs[i].done=!subs[i].done;if(subs[i].done)subs[i].at=Date.now();else delete subs[i].at;
      if(subs.every(x=>x.done)){t.subs=subs;completeTask(t,null);toBreak(t);pipBig=true;drawPip(true);setTimeout(pipFit,30);return}
      setSubs(t,subs);if(subs[i].done&&P.subI===i){const nx=subs.findIndex(x=>!x.done);P.subI=nx>=0?nx:null;saveP()}renderPomo();drawPip(true);pipArm(4000);return}
    if(a==="done"){const t=curTask();if(!t)return;completeTask(t,null);toBreak(t);pipBig=true;drawPip(true);setTimeout(pipFit,30);return}});
  pipWin.addEventListener("pagehide",()=>{pipWin=null;clearTimeout(pipT);renderPomo()});
  drawPip(true);renderPomo();
}

/* quick-capture repeat parsing */
function pickRepeat(text,today){
  let r=null, rest=text, m;
  const wdList=s=>[...s.matchAll(/[一二三四五六日天]/g)].map(x=>WDMAP[x[0]]);
  const enWd=s=>[...s.toLowerCase().matchAll(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*/g)].map(x=>({sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6})[x[1]]);
  const tries=[
    [/每个?工作日/,()=>({freq:"week",days:[1,2,3,4,5]})],
    [/每(?:天|日)/,()=>({freq:"day"})],
    [/每个?月\s*(?:的)?第\s*([一二三四1-4])\s*个?\s*(?:周|星期|礼拜)([一二三四五六日天])/,m=>({freq:"month",nth:toNum(m[1]),wd:WDMAP[m[2]]})],
    [/每个?月\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[号日]/,m=>({freq:"month",mday:toNum(m[1])})],
    [/(?:每两周|每隔一周|隔周)\s*(?:的)?\s*(?:周|星期|礼拜)?((?:[一二三四五六日天](?:[、，,和及]\s*(?:周|星期)?)?)+)/,m=>({freq:"2week",days:wdList(m[1])})],
    [/每\s*(?:个)?(?:周|星期|礼拜)((?:[一二三四五六日天](?:[、，,和及]\s*(?:周|星期)?)?)+)/,m=>({freq:"week",days:wdList(m[1])})],
    [/\bevery\s+weekday\b|\bweekdays\b/i,()=>({freq:"week",days:[1,2,3,4,5]})],
    [/\b(?:every\s*day|daily)\b/i,()=>({freq:"day"})],
    [/\bevery\s+month\s+on\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\b|\bmonthly\s+on\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\b|\bon\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?every\s+month\b/i,m=>({freq:"month",mday:+(m[1]||m[2]||m[3])})],
    [/\b(?:every\s+month|monthly)\b/i,()=>({freq:"month",mday:+today.slice(8)})],
    [/\bevery\s+(?:other|second|2nd)\s+((?:(?:mon(?:day)?|tues?(?:day)?|wed(?:nesday)?|thu(?:rs?)?(?:day)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b(?:\s*(?:,|and|&)\s*)?)+)/i,m=>({freq:"2week",days:enWd(m[1])})],
    [/\bevery\s+((?:(?:mon(?:day)?|tues?(?:day)?|wed(?:nesday)?|thu(?:rs?)?(?:day)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b(?:\s*(?:,|and|&)\s*)?)+)/i,m=>({freq:"week",days:enWd(m[1])})],
    [/\b(?:on\s+)?(?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)\b/i,m=>({freq:"week",days:enWd(m[0])})],
  ];
  for(const [re,fn] of tries){m=rest.match(re);if(m){r=fn(m);rest=rest.replace(m[0]," ");break}}
  if(!r||(r.days&&!r.days.length))return {repeat:null,rest:text};
  let until=null;
  if((m=rest.match(/(?:到|直到|截止到)\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*月\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[日号]?(?:为止)?/))){const [Y,M]=today.split("-").map(Number);let y=Y;if(toNum(m[1])<M)y++;until=`${y}-${pad(toNum(m[1]))}-${pad(toNum(m[2]))}`;rest=rest.replace(m[0]," ")}
  else if((m=rest.match(/持续\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*(周|个?星期|天|个?月)/))){const n=toNum(m[1]);until=addDays(today,(m[2].includes("天")?n:m[2].includes("月")?n*30:n*7)-1);rest=rest.replace(m[0]," ")}
  else if((m=rest.match(/\bfor\s+(\d{1,2}|one|two|three|four|five|six)\s+(weeks?|days?|months?)\b/i))){const n=/\d/.test(m[1])?+m[1]:ENNUM[m[1].toLowerCase()];until=addDays(today,(/day/i.test(m[2])?n:/month/i.test(m[2])?n*30:n*7)-1);rest=rest.replace(m[0]," ")}
  else if((m=rest.match(/\buntil\s+(.+?)$/i))){const pd=pickDate(m[1],today,lang==="en");if(pd.due){until=pd.due;rest=rest.replace(m[0]," ")}}
  if(until)r.until=until;
  return {repeat:r,rest};
}

function openCelebrate(list,i){

  const draw=()=>{bg.innerHTML=`<div class="sheet cel" role="dialog" aria-label="${L("周年庆祝","Anniversary")}"><svg class="conf" width="100%" height="100%" aria-hidden="true">${conf}</svg>${PARTY}

    if(writing)setTimeout(()=>bg.querySelector("#cel-note")?.focus(),30)};

  });
}

}
function shiftMonth(n){const [y,m]=(calMonth||(jDate||todayStr()).slice(0,7)).split("-").map(Number);const d=new Date(y,m-1+n,1);calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()}

function commitSort(box){
  const key=box.dataset.sort, rows=[...box.querySelectorAll(":scope>[data-row]")];
  if(key.startsWith("memo:")){
    const id=key.slice(5), m=memos.find(x=>x.id===id); if(!m)return;
    const order=rows.map(r=>+r.dataset.i); if(order.every((v,i)=>v===i))return;

    const order=rows.map(r=>+r.dataset.j); if(order.every((v,i)=>v===i))return;

document.addEventListener("pointerdown",e=>{
  const g=e.target.closest&&e.target.closest(".grip"); if(!g||!db)return;
  const row=g.closest("[data-row]"), box=row&&row.parentElement; if(!box||!box.dataset.sort)return;
  e.preventDefault(); dragLock=true; row.classList.add("dragging");
  const move=ev=>{
    const rows=[...box.querySelectorAll(":scope>[data-row]")], my=rows.indexOf(row);
    for(let k=0;k<rows.length;k++){const r=rows[k];if(r===row)continue;const rc=r.getBoundingClientRect(), mid=rc.top+rc.height/2;

  const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    row.classList.remove("dragging");dragLock=false;commitSort(box);if(renderPending){renderPending=false;render()}};
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
});
document.addEventListener("keydown",e=>{
  const g=e.target.closest&&e.target.closest(".grip"); if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;

  commitSort(box);
});

const LS_KEY="lifeos-data-v1", NAME_KEY="lifeos-name";

function makeLocalDB(){
  let data={}, firstRun=false;
  try{const raw=localStorage.getItem(LS_KEY);if(raw)data=JSON.parse(raw);else firstRun=true}catch(e){firstRun=true}
  const listeners=[];
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){setStatus(L("浏览器存储满了，先导出备份再清理一些已完成的内容。","Browser storage is full. Export a backup, then clear out some finished items."))}};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=col=>{const c=data[col]||{};const docs=Object.keys(c).map(id=>({id,exists:true,data:()=>c[id],metadata:meta}));return {docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}};
  const emit=col=>listeners.filter(l=>l.col===col).forEach(l=>l.cb(snap(col)));
  const emitAll=()=>[...new Set(listeners.map(l=>l.col))].forEach(emit);
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const clone=x=>JSON.parse(JSON.stringify(x));
  const docRef=(col,id)=>({id,path:col+"/"+id,
    async get(){const v=(data[col]||{})[id];return {id,exists:!!v,data:()=>v,metadata:meta}},
    async set(b,o){const c=(data[col]=data[col]||{});if(o&&o.merge&&c[id]){const n={...c[id]};for(const k in b)n[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&n[k]&&typeof n[k]==="object")?{...n[k],...clone(b[k])}:clone(b[k]);c[id]=n}else c[id]=clone(b);save();emit(col)},
    async update(b){const c=data[col]||{};if(!c[id])throw {code:"invalid_argument"};c[id]={...c[id],...clone(b)};save();emit(col)},
    async delete(){if(data[col])delete data[col][id];save();emit(col)}});
  const colRef=col=>{const q={path:col,doc:id=>docRef(col,id||rid()),orderBy:()=>q,limit:()=>q,
    onSnapshot(cb){const l={col,cb};listeners.push(l);setTimeout(()=>cb(snap(col)),0);return ()=>{const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}};return q};
  // keep two open tabs in step
  window.addEventListener("storage",e=>{if(e.key===LS_KEY){try{data=JSON.parse(e.newValue||"{}")}catch(_){data={}}emitAll()}});
  return {firstRun,mergeSet:true,doc:p=>{const [c,i]=p.split("/");return docRef(c,i)},collection:colRef,
    dump:()=>clone(data),replace:d=>{data=clone(d);save();emitAll()}};
}

// same shape as the local store, so the rest of the page doesn't care where data lives
function makeCloudDB(uid){
  const root=fb.fs.collection("users").doc(uid);
  const wrapDoc=r=>({id:r.id,path:r.path,
    get:async()=>{const s=await r.get();return {id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata}},
    set:(b,o)=>o?r.set(clone(b),o):r.set(clone(b)), update:b=>r.update(clone(b)), delete:()=>r.delete()});
  const wrapQuery=q=>({orderBy:(f,d)=>wrapQuery(q.orderBy(f,d)),limit:n=>wrapQuery(q.limit(n)),get:()=>q.get(),
    onSnapshot:(cb,err)=>q.onSnapshot({includeMetadataChanges:false},cb,err)});
  return {cloud:true,mergeSet:true,
    doc:p=>{const [c,i]=p.split("/");return wrapDoc(root.collection(c).doc(i))},
    collection:c=>{const col=root.collection(c);return {...wrapQuery(col),path:col.path,doc:id=>wrapDoc(id?col.doc(id):col.doc())}},
    dump:async()=>{const out={};for(const c of COLS){const s=await root.collection(c).get();if(!s.empty){out[c]={};s.forEach(d=>out[c][d.id]=d.data())}}return out},
    replace:async data=>{
      const writes=[];
      for(const c of COLS){const s=await root.collection(c).get();s.forEach(d=>writes.push(["del",d.ref]))}
      for(const c in data||{})for(const id in data[c])writes.push(["set",root.collection(c).doc(id),data[c][id]]);
      for(let i=0;i<writes.length;i+=400){const b=fb.fs.batch();writes.slice(i,i+400).forEach(([op,ref,v])=>op==="del"?b.delete(ref):b.set(ref,clone(v)));await b.commit()}
    },
    merge:async data=>{
      const writes=[];for(const c in data||{})if(COLS.includes(c))for(const id in data[c])writes.push([root.collection(c).doc(id),data[c][id]]);
      for(let i=0;i<writes.length;i+=400){const b=fb.fs.batch();writes.slice(i,i+400).forEach(([ref,v])=>b.set(ref,clone(v),{merge:true}));await b.commit()}
    },
    meta:root.collection("meta").doc("profile")};
}

    }catch(ex){err=authErr(ex);draw()}
  });
  bg.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();bg.querySelector('[data-au="email"]').click()}if(e.key==="Escape")bg.remove()});
}
function syncSection(){
  if(cloudState==="off")return "";
  let body;
  if(cloudState==="signedin")body=`<p class="hint" style="margin:0">${L("已登录","Signed in as")} <b>${esc(cloudUser.email||cloudUser.displayName||"")}</b>${L("，手机和电脑会自动同步。",". Your devices stay in sync.")}</p><div class="cap-row"><button class="btn" data-set="signout">${L("退出登录","Sign out")}</button></div>`;
  else if(cloudState==="unavailable")body=`<p class="hint" style="margin:0">${L("现在连不上同步服务（比如在中国大陆），先用这台设备上的本地数据。","The sync service can't be reached right now (for example in mainland China), so you're using this device's data.")}</p>`;
  else if(cloudState==="loading")body=`<p class="hint" style="margin:0">${L("正在连接同步服务…","Connecting to sync…")}</p>`;
  else body=`<p class="hint" style="margin:0">${L("现在数据只存在这台设备上。登录后，手机和电脑会自动同步。","Right now your data lives only on this device. Sign in to sync your phone and computer.")}</p><div class="cap-row"><button class="btn primary" data-set="signin">${L("登录同步","Sign in to sync")}</button></div>`;
  const ic=cloudState==="signedin"?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.2 4.4 4.4 0 0 0 7 18z" fill="var(--water)"/><path d="M9 13.5l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.2 4.4 4.4 0 0 0 7 18z" fill="none" stroke="var(--muted)" stroke-width="1.8"/></svg>`;
  return `<div class="field synccard"><span>${L("同步","Sync")}</span><div class="sc-body">${ic}<div>${body}</div></div></div>`;
}
function renderSync(){
  const g=document.getElementById("gear"); if(g){g.classList.toggle("synced",cloudState==="signedin");g.setAttribute("aria-label",cloudState==="signedin"?L("设置 · 已同步","Settings · synced"):L("设置","Settings"))}
  const b=document.getElementById("syncBtn"); if(!b)return;
  b.hidden=true;
  const on=cloudState==="signedin";
  b.classList.toggle("on",on);
  b.title=on?L("已同步","Synced"):L("登录同步","Sign in to sync");
  b.setAttribute("aria-label",b.title);
  b.innerHTML=on?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.2 4.4 4.4 0 0 0 7 18z" fill="var(--water)"/><path d="M9 13.5l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                :`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.2 4.4 4.4 0 0 0 7 18z" fill="none" stroke="var(--muted)" stroke-width="1.8"/><path d="M12 10.5v5M9.5 13h5" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
async function startCloud(){
  if(!FIREBASE_CONFIG)return;
  let waited=false; try{waited=!!localStorage.getItem(CLOUD_KEY)}catch(_){}
  renderSync();
  try{fb=await loadFirebase()}catch(e){cloudState="unavailable";renderSync();if(!db){startData(localDB);setStatus("")}return}
  fb.auth.getRedirectResult().catch(()=>{});
  fb.auth.onAuthStateChanged(user=>{
    if(user){if(!cloudUser||cloudUser.uid!==user.uid){setStatus("");onSignedIn(user)}}
    else{const was=cloudState==="signedin";cloudUser=null;cloudState="signedout";try{localStorage.removeItem(CLOUD_KEY)}catch(_){}
      if(was||!db)startData(localDB); setStatus(""); renderSync();
      if(was)cheer(L("已退出登录，现在显示的是这台设备上的本地数据。","Signed out. You're now seeing this device's own data."))}
  });
}

(()=>{
  buildStrings(); applyStatic(); applyName();
  sample=null;
  {let sid=null;try{sid=new URLSearchParams(location.search).get("l")}catch(_){}
   if(sid&&(FIREBASE_CONFIG||window.__shareMock)&&/^[A-Za-z0-9]{8,40}$/.test(sid)){friendView(sid);return}}
  localDB=makeLocalDB();
  if(localDB.firstRun){db=localDB;seed();db=null}
  let welcomed=false; try{welcomed=!!localStorage.getItem("lifeos-welcomed")}catch(_){}
  if(!userName&&!welcomed)openWelcome();
  let waited=false; try{waited=!!FIREBASE_CONFIG&&!!localStorage.getItem(CLOUD_KEY)}catch(_){}
  // signed in here before: wait a moment for the account instead of flashing this device's copy
  if(waited){setStatus(L("正在同步你的数据…","Syncing your data…"));setTimeout(()=>{if(!db){startData(localDB);setStatus(L("同步服务暂时连不上，先显示这台设备上的数据。","Can't reach sync right now, so this is the data on this device."))}},8000)}
  else startData(localDB);
  startCloud();
})();
